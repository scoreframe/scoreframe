<style>
/* Club console (2026-10-28, CLUB_BILLING_SPEC.md; mockups approved).
   Light only, like dashboard.html: this page is never shown inside the apps,
   which by design never link to anything that sells the club license. */
*, *::before, *::after { box-sizing: border-box; }
:root {
  color-scheme: light;
  --paper: #F5F5F2; --card: #FFFFFF; --ink: #1C1B1F; --mu: #5A565F; --ln: #E2DFDA; --ln2: #EFECE7;
  --deep: #111215; --deep2: #1B1C21; --deep-tx: #F1EEE9; --deep-mu: #A9ADB6;
  --orange: #FF9640; --on-orange: #1A1004; --link: #A64F0A; --link-h: #7A3906;
  --ok-bg: #E3F5EA; --ok: #146B3D; --warn-bg: #FFF1DC; --warn: #8A4B00; --bad-bg: #FFE3E3; --bad: #B3121D;
  --info-bg: #FFF4EA; --info-ln: #F4CFA9;
}
html, body { margin: 0; background: var(--paper); color: var(--ink);
  font-family: Archivo, -apple-system, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
a { color: var(--link); } a:hover { color: var(--link-h); }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
input, select { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #D6D2CC; border-radius: 9px; background: #fff; color: var(--ink); min-width: 0; }
label { font-size: 13px; font-weight: 600; color: var(--mu); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

header.top { background: var(--deep); color: var(--deep-tx); padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--deep-tx); }
.brand .tile { width: 30px; height: 30px; border-radius: 8px; background: var(--orange); color: var(--on-orange); font-weight: 900; display: flex; align-items: center; justify-content: center; }
.brand .word { font-weight: 900; font-size: 18px; letter-spacing: .4px; } .brand .word b { color: var(--orange); }
.pill-club { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--deep-mu); border: 1px solid #3A3C44; border-radius: 99px; padding: 3px 9px; }
nav.tabs { display: flex; gap: 20px; margin-left: 12px; flex-wrap: wrap; }
nav.tabs button { background: none; border: 0; color: var(--deep-mu); font-size: 15px; padding: 6px 0; border-bottom: 2px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--deep-tx); font-weight: 700; border-bottom-color: var(--orange); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--deep-mu); flex-wrap: wrap; }
.who select { background: var(--deep2); color: var(--deep-tx); border-color: #3A3C44; padding: 6px 10px; font-size: 14px; }
.who button { background: none; border: 1px solid #3A3C44; color: var(--deep-mu); border-radius: 7px; padding: 5px 10px; font-size: 13px; }

main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 22px; }
.card { background: var(--card); border: 1px solid var(--ln); border-radius: 14px; }
.pad { padding: 20px 22px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: var(--mu); text-transform: uppercase; }
.muted { color: var(--mu); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; padding: 11px 16px; border-radius: 10px; font-weight: 700; font-size: 15px; border: 1px solid transparent; min-height: 44px; }
.btn.primary { background: var(--orange); color: var(--on-orange); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.ghost { background: #fff; color: var(--ink); border-color: #D6D2CC; font-weight: 600; }
.btn.link { background: none; color: var(--link); padding: 6px 4px; min-height: 0; font-weight: 600; }
.btn:disabled { opacity: .55; cursor: default; }
.status { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.s-ok { background: var(--ok-bg); color: var(--ok); } .s-warn { background: var(--warn-bg); color: var(--warn); }
.s-bad { background: var(--bad-bg); color: var(--bad); } .s-mu { background: #ECECE8; color: var(--mu); }
.banner { border-radius: 14px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 15px; line-height: 1.45; }
.banner .txt { flex: 1 1 380px; }
.b-info { background: var(--info-bg); border: 1px solid var(--info-ln); }
.b-ok { background: var(--ok-bg); border: 1px solid #B7E2C8; }
.b-warn { background: var(--warn-bg); border: 1px solid #F0D2A6; }
.b-bad { background: var(--bad-bg); border: 1px solid #F3B9B9; }
.crest { border-radius: 14px; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.bar { height: 8px; background: #ECECE8; border-radius: 99px; overflow: hidden; } .bar > span { display: block; height: 100%; background: var(--orange); }
.big { font-size: 32px; font-weight: 900; line-height: 1.1; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; color: var(--mu); font-size: 12px; letter-spacing: 1px; font-weight: 700; padding: 10px 12px; text-transform: uppercase; }
.tbl td { padding: 12px; border-top: 1px solid var(--ln2); vertical-align: middle; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: #FAF9F7; }
.tbl th:first-child, .tbl td:first-child { padding-left: 22px; } .tbl th:last-child, .tbl td:last-child { padding-right: 22px; }
.scroll { overflow-x: auto; }
.teamsq { width: 34px; height: 34px; border-radius: 9px; color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
img.logo { object-fit: contain; background: #fff; border: 1px solid var(--ln); padding: 3px; flex-shrink: 0; }
.logobox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.order button { background: none; border: 1px solid var(--ln); border-radius: 7px; width: 32px; height: 32px; color: var(--mu); }
.order button:disabled { opacity: .3; }
.split { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.split > .main { flex: 999 1 560px; min-width: 0; } .split > .side { flex: 1 1 320px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.choice { text-align: left; padding: 14px; border-radius: 12px; border: 1px solid #D6D2CC; background: #fff; display: flex; flex-direction: column; gap: 4px; }
.choice[aria-pressed="true"] { border: 2px solid var(--orange); background: var(--info-bg); padding: 13px; }
.choice b { font-size: 18px; } .choice span { font-size: 13px; color: var(--mu); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D6D2CC; background: #fff; font-size: 24px; font-weight: 700; }
.stepper output { min-width: 70px; text-align: center; font-size: 36px; font-weight: 900; }
.summary { background: var(--deep); color: var(--deep-tx); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.summary .ln { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; } .summary .ln span:first-child { color: var(--deep-mu); }
.summary hr { border: 0; border-top: 1px solid #2E3038; margin: 2px 0; width: 100%; }
.failtoast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #B42318; color: #fff; padding: 10px 8px 10px 16px; border-radius: 10px; font-size: 14px; line-height: 1.4; z-index: 21; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; align-items: center; gap: 8px; cursor: pointer; }
.failtoast button { background: none; border: 0; color: #fff; font-size: 18px; line-height: 1; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
.failtoast button:focus-visible { outline: 2px solid #fff; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--ink); }
dialog::backdrop { background: rgba(17,18,21,.45); }
dialog form { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.hero { border-radius: 16px; padding: 22px; color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.person { display: flex; align-items: center; gap: 14px; padding: 13px 22px; border-top: 1px solid var(--ln2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #ECECE8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.hide { display: none !important; }
.signin { max-width: 440px; margin: 40px auto; text-align: center; display: flex; flex-direction: column; gap: 14px; }
.signin input { width: 100%; }
.loading { padding: 60px 0; text-align: center; color: var(--mu); }

/* Storefront (signed out). body.store hides the console header; sections run full width. */
body.store header.top { display: none; }
body.store main { max-width: none; padding: 0; gap: 0; }
.s-wrap { max-width: 1160px; margin: 0 auto; padding-inline: 24px; width: 100%; }
.s-top { border-bottom: 1px solid var(--ln); background: var(--paper); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.s-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 14px; }
.s-mark { font-weight: 900; font-size: 22px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.s-mark b { color: #E07A1F; } .s-mark span { font: 700 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .14em; color: var(--link); margin-left: 6px; }
.s-nav nav { display: flex; flex-wrap: wrap; gap: 4px 22px; flex: 1 1 auto; font-weight: 700; font-size: 15px; }
.s-nav nav a { color: var(--ink); text-decoration: none; } .s-nav nav a:hover { color: var(--link); }
.s-acts { display: flex; gap: 10px; flex-wrap: wrap; }
.s-btn { height: 42px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--orange); color: var(--on-orange); font-weight: 900; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.s-btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); font-weight: 700; }
.s-btn.big { height: 52px; padding: 0 24px; border-radius: 14px; font-size: 17px; }
.s-btn.ink { background: var(--on-orange); color: #fff; }
.s-eb { font: 700 12px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--link); }
.s-hero { display: flex; flex-wrap: wrap; gap: 48px; align-items: center; padding-block: 64px 56px; }
.s-copy { flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.s-copy h1 { font-size: clamp(40px, 5.6vw, 62px); line-height: .98; font-weight: 900; letter-spacing: -.015em; }
.s-lede { margin: 0; font-size: 19px; color: var(--mu); max-width: 46ch; line-height: 1.5; }
.s-row { display: flex; flex-wrap: wrap; gap: 12px; }
.s-fine { font-size: 14px; color: var(--mu); } .s-fine.dark { color: var(--deep-mu); font-size: 13px; }
.s-club { flex: 1 1 400px; min-width: 0; background: #fff; border: 1px solid var(--ln); border-radius: 22px; box-shadow: 0 18px 40px rgba(28,27,31,.10); overflow: hidden; }
.s-clubhead { background: linear-gradient(120deg, #17306E, #D9A400); padding: 18px 20px; display: flex; align-items: center; gap: 14px; color: #fff; }
.s-crest { width: 52px; height: 52px; border-radius: 14px; background: #fff; color: #17306E; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; }
.s-clubname { font-weight: 900; font-size: 22px; line-height: 1.1; } .s-clubsub { font-size: 13px; opacity: .9; }
.s-list { padding: 8px 8px 12px; display: flex; flex-direction: column; }
.s-it { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; } .s-it.live { background: #FFF1F0; }
.s-it .sq { width: 36px; height: 36px; border-radius: 10px; background: #17306E; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; flex-shrink: 0; }
.s-tx { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; } .s-tx span { font-size: 13px; color: var(--mu); }
.s-live { font: 700 11px "JetBrains Mono", monospace; letter-spacing: .1em; background: #C71A1A; color: #fff; padding: 4px 8px; border-radius: 6px; }
.s-clubfoot { border-top: 1px solid var(--ln); padding: 12px 20px; font-size: 13px; color: var(--mu); }
.s-band { background: #fff; border-top: 1px solid var(--ln); border-bottom: 1px solid var(--ln); }
.s-sec { padding-block: 64px; display: flex; flex-direction: column; gap: 28px; }
.s-head { display: flex; flex-direction: column; gap: 10px; max-width: 680px; }
.s-sec h2, .s-pcopy h2 { font-size: clamp(30px, 3.6vw, 42px); line-height: 1.02; font-weight: 900; letter-spacing: -.015em; }
h2.sm { font-size: clamp(26px, 3vw, 36px); line-height: 1.05; font-weight: 900; letter-spacing: -.015em; }
.s-feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 28px 36px; }
.s-feat { display: flex; flex-direction: column; gap: 8px; } .s-feat h3 { font-size: 20px; font-weight: 900; } .s-feat p, .s-step p { margin: 0; color: var(--mu); line-height: 1.5; }
.s-steps { display: flex; flex-wrap: wrap; gap: 20px; }
.s-step { flex: 1 1 290px; min-width: 0; background: #fff; border: 1px solid var(--ln); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 8px; }
.s-step h3 { font-size: 20px; font-weight: 900; } .s-n { font: 700 14px "JetBrains Mono", monospace; color: var(--link); }
.s-dark { background: var(--deep); color: var(--deep-tx); }
.s-price { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; padding-block: 64px; }
.s-pcopy { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px; } .s-pcopy .s-eb { color: #FFB477; }
.s-pr { display: flex; align-items: baseline; gap: 12px; color: var(--deep-mu); flex-wrap: wrap; }
.s-pr span { font-size: 52px; font-weight: 900; color: var(--orange); line-height: 1.1; }
.s-pcopy ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.s-calc { flex: 1 1 400px; min-width: 0; background: var(--deep2); border: 1px solid #2E3038; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 18px; }
.s-calct { font-weight: 900; font-size: 20px; }
.s-calc label { flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; color: var(--deep-mu); font-size: 14px; }
.s-calc input { height: 48px; border-radius: 12px; border: 1px solid #3D4048; background: var(--deep); color: var(--deep-tx); font-weight: 900; font-size: 20px; }
.s-total { border-top: 1px solid #2E3038; padding-top: 16px; display: flex; flex-direction: column; gap: 4px; color: var(--deep-mu); }
.s-total output { font-size: 44px; font-weight: 900; color: var(--deep-tx); line-height: 1.1; }
.s-tbl { overflow-x: auto; border: 1px solid var(--ln); border-radius: 18px; background: #fff; }

.s-tbl th, .s-tbl td { padding: 14px 18px; text-align: left; } .s-tbl th { font-weight: 900; } .s-tbl td:first-child { font-weight: 700; width: 30%; }
.s-tbl tr + tr td, .s-tbl tbody tr:first-child td { border-top: 1px solid var(--ln2); } .s-tbl .mu { color: var(--mu); font-weight: 400; }

.s-ctain > div { display: flex; flex-direction: column; gap: 6px; flex: 1 1 420px; font-size: 17px; }
.s-foot { display: flex; flex-wrap: wrap; gap: 10px 24px; padding-block: 28px 40px; font-size: 14px; color: var(--mu); } .s-foot a { color: var(--mu); }
.fl { display: flex; flex-direction: column; gap: 16px; }
.fl-scene { overflow-x: auto; background: #fff; border: 1px solid var(--ln); border-radius: 18px; padding: 12px; }
.fl-scene svg { display: block; width: 100%; min-width: 760px; height: auto; font-family: Archivo, -apple-system, Arial, sans-serif; }

.fl-title { font-size: 18px; font-weight: 900; }
.fl-node ul { margin: 2px 0 0; padding-left: 18px; color: var(--mu); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; gap: 3px; }
.fl-arrow { flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #E07A1F; font-size: 12px; font-weight: 700; }
.fl-arrow span { color: var(--mu); }
.fl-loops { display: flex; flex-wrap: wrap; gap: 12px; }
.fl-loop { flex: 1 1 360px; min-width: 0; background: var(--info-bg); border: 1px dashed #E7B98C; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.5; }

  .fl-main { flex-direction: column; }
  .fl-arrow { flex-basis: auto; flex-direction: row; padding: 2px 0; } .fl-arrow svg { transform: rotate(90deg); }
}
.bracket { overflow-x: auto; } .bracket svg { display: block; width: 100%; min-width: 760px; height: auto; font-family: Archivo, -apple-system, Arial, sans-serif; }
.fanrow { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.fanpg { flex: 1 1 300px; max-width: 360px; min-width: 0; background: #fff; border: 1px solid var(--ln); border-radius: 22px; overflow: hidden; box-shadow: 0 10px 26px rgba(28,27,31,.08); }
.fanbar { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--mu); padding: 9px 14px; border-bottom: 1px solid var(--ln); background: var(--paper); }
dialog.demo { width: min(1120px, calc(100% - 24px)); height: min(880px, calc(100% - 24px)); background: var(--paper); display: none; flex-direction: column; overflow: hidden; }
dialog.demo[open] { display: flex; }
.demo-top { background: var(--deep); color: var(--deep-tx); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
.demo-top nav.tabs { margin-left: 4px; }
.demo-x { margin-left: auto; background: none; border: 1px solid #3A3C44; color: var(--deep-tx); border-radius: 8px; padding: 7px 12px; font-size: 14px; }
.demo-note { background: var(--info-bg); border-bottom: 1px solid var(--info-ln); padding: 9px 20px; font-size: 14px; }
.demo-body { flex: 1 1 auto; overflow-y: auto; padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.demo-foot { border-top: 1px solid var(--ln); background: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; font-weight: 700; }
@media (max-width: 720px) {
  .s-hero { padding-block: 40px; gap: 32px; } .s-sec, .s-price { padding-block: 44px; }

async function logoDataUrl(file) {
  if (!file) return null;
  if (!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)) throw new Error('Use a PNG, JPG or WebP image.');
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("That image couldn't be read.")); i.src = URL.createObjectURL(file); });

  URL.revokeObjectURL(img.src);
  let url = cv.toDataURL('image/png');
  if (url.length > 1200000) url = cv.toDataURL('image/webp', 0.9);
  return url;
}

onAuthStateChanged(auth, async (u) => {
  S.unsub.forEach(f => f()); S.unsub = [];
  S.user = u && !u.isAnonymous ? u : null;
  if (!S.user) { renderWho(); renderSignIn(); if (params.get('director') && typeof openSignIn === 'function') openSignIn(); return; }
  document.body.classList.remove('store'); document.title = 'ScoreFrame Club';
  if ($('dlg').open) $('dlg').close(); if ($('demo').open) $('demo').close();
  // Admin = the two ScoreFrame admin Google accounts (rules isAdmin(), functions/lib/admin.js), not every super user.
  try { const tok = await u.getIdTokenResult(); S.superUser = ['support@scoreframe.app', 'eric@bloomcamp.com'].includes(String(u.email || '').toLowerCase()) && u.emailVerified && tok.signInProvider === 'google.com'; } catch (_) { S.superUser = false; }
  await loadClubs();
  // A director invitation link (club_directors.js): accept it as this account.
  if (params.get('director') && !S.dirTried) {
    S.dirTried = true;
    $('main').innerHTML = '<div class="loading">Accepting your invitation…</div>';
    try {
      const r = await call('clubDirectorAccept', { clubId: params.get('club'), token: params.get('director') });
      await loadClubs(); S.clubId = r.clubId;
      history.replaceState(null, '', `club.html?club=${encodeURIComponent(r.clubId)}`);
      toast(`You're now a director of ${(S.clubs.find(c => c.id === r.clubId) || {}).name || 'the club'}.`, 6000);
    } catch (e) {
      renderWho(); $('tabs').classList.add('hide');
      $('main').innerHTML = `<section class="card pad" style="max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;">
        <h1 style="font-size:24px;font-weight:900;">This invitation didn't work</h1>
        <p class="muted" style="margin:0;line-height:1.5;">${esc(errText(e))}</p>
        <p class="muted" style="margin:0;line-height:1.5;">You're signed in as ${esc(S.user.email || 'this account')}.</p>
        <div><button class="btn ghost" type="button" id="dirOut">Sign out</button></div></section>`;
      $('dirOut').onclick = () => signOut(auth);
      return;
    }
  }
  try { const p = await getDoc(doc(db, 'app_config', 'club_pricing')); S.pricing = p.exists() ? p.data() : null; } catch (_) { S.pricing = null; }
  if (ytReturn && !ytReturn.done) {
    ytReturn.done = true;
    if (ytReturn.error) toast(ytReturn.error === 'access_denied' ? 'YouTube wasn\'t connected. You can try again any time.' : `Google said: ${ytReturn.error}`, 6000);
    else {
      $('main').innerHTML = '<div class="loading">Connecting your YouTube channel…</div>';
      try {
        const r = await call('clubYouTubeConnect', { state: ytReturn.state, code: ytReturn.code });
        S.clubId = r.clubId; S.tab = 'settings'; S.ytFocus = true;
        toast(r.status === 'ready' ? `${r.title} is connected and ready to go live.` : `${r.title} is connected. YouTube still has to turn on live streaming for it.`, 7000);
      } catch (e) { S.tab = 'settings'; S.ytFocus = true; toast(errText(e), 9000); }
    }
  }
  if (S.clubId && (S.clubs.some(c => c.id === S.clubId) || S.superUser)) openClub(S.clubId);
  else if (S.clubs.length) openClub(S.clubs[0].id);
  else { renderWho(); renderCreate(); }
});

// Directors (2026-10-30): invite another, remove one, or leave. The server never lets the last one go.
async function loadDirectors() {
  const box = $('dirList'); if (!box) return;
  let r;
  try { r = await call('clubDirectors', { clubId: S.clubId }); } catch (e) { box.textContent = errText(e); return; }
  const many = r.directors.length > 1;
  const row = (main, sub, btn) => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line, #E3E0DA);">
      <div style="flex:1;min-width:0;"><div style="font-weight:700;color:var(--fg, #1C1B1F);overflow-wrap:anywhere;">${main}</div><div class="muted" style="font-size:13px;">${sub}</div></div>${btn}</div>`;
  box.innerHTML = r.directors.map(d => row(esc(d.name || d.email || 'Director') + (d.you ? ' (you)' : ''),
      [d.name ? esc(d.email) : '', d.owner ? 'Owns the teams made here' : ''].filter(Boolean).join(' · ') || 'Director',
      many ? `<button class="btn link" type="button" data-dirrm="${esc(d.uid)}" data-you="${d.you ? 1 : ''}" data-who="${esc(d.name || d.email)}" data-owner="${d.owner ? 1 : ''}">${d.you ? 'Leave' : 'Remove'}</button>` : '')).join('')
    + r.invites.map(i => row(esc(i.email), `Invited · the link works until ${new Date(i.expiresAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`,
      `<button class="btn link" type="button" data-dircx="${esc(i.id)}">Withdraw</button>`)).join('');

function openClub(clubId) {
  S.unsub.forEach(f => f()); S.unsub = [];
  S.clubId = clubId; S.club = null; S.licenses = []; S.teams = {};
  S.teamId = params.get('team') && S.tab === 'teams' ? params.get('team') : null;
  params.delete('team');
  renderWho(); setUrl();
  $('main').innerHTML = '<div class="loading">Loading the club…</div>';
  // The console refreshes coverage on open, which also picks up teams
  // archived or deleted in the apps since the last daily check.
  call('clubRefresh', { clubId }).catch(() => {});
  S.unsub.push(onSnapshot(doc(db, 'clubs', clubId), async (snap) => {
    if (!snap.exists()) { $('main').innerHTML = '<div class="loading">This club doesn\'t exist or you aren\'t its director.</div>'; return; }
    S.club = { id: snap.id, ...snap.data() };
    const before = S.teamId ? JSON.stringify(S.teams[S.teamId] || null) : null;
    await loadTeams();
    // On a team page, only redraw when that team changed (an invite being typed survives).
    if (S.teamId && document.getElementById('iEm') && JSON.stringify(S.teams[S.teamId] || null) === before) return;
    render();
  }, (e) => { $('main').innerHTML = `<div class="loading">Couldn't open the club: ${esc(errText(e))}</div>`; }));
  S.unsub.push(onSnapshot(collection(db, 'clubs', clubId, 'licenses'), (snap) => {
    S.licenses = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (S.club && !S.teamId) render();
  }));
}

async function loadTeams() {
  const ids = S.club.teamIds || [];
  const out = {};
  await Promise.all(ids.map(async id => { try { const s = await getDoc(doc(db, 'teams', id)); if (s.exists()) out[id] = { id, ...s.data() }; } catch (_) {} }));
  S.teams = out;
}

function render() {
  if (!S.club) return;
  $('tabs').classList.remove('hide');
  document.querySelectorAll('#tabs button').forEach(b => {
    b.setAttribute('aria-current', b.dataset.tab === S.tab && !S.teamId ? 'page' : 'false');
    if (b.dataset.tab === 'teams' && S.teamId) b.setAttribute('aria-current', 'page');
    b.onclick = () => { S.tab = b.dataset.tab; S.teamId = null; setUrl(); render(); };
  });
  if (S.teamId) return renderTeam();
  if (S.tab === 'billing') return renderBilling();
  if (S.tab === 'settings') return renderSettings();
  if (S.tab === 'tournaments') return renderTournaments();

const normName = (x) => String(x || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function bestTeamFor(aesName) {
  const a = normName(aesName); const nums = (String(aesName).match(/\d+/g) || []);
  let best = null, score = 0;
  for (const r of teamRows()) {
    const t = normName(r.t.name); let sc = 0;
    if (a.includes(t) || t.includes(a)) sc += 3;
    for (const n of nums) if (String(r.t.name).includes(n) || String(r.t.ageDivision || '').includes(n)) sc += 2;
    for (const w of String(r.t.name).toLowerCase().split(/\s+/)) if (w.length > 2 && a.includes(normName(w))) sc += 1;
    if (sc > score) { score = sc; best = r.id; }
  }
  return score >= 2 ? best : '';
}

            <div class="field"><label for="lkC2">Second color</label><input id="lkC2" type="color" value="${esc(t.color2 || '#FFFFFF')}" style="height:44px;padding:4px;"></div>
          </div>
          <div class="field"><label for="lkLogo">Logo</label><select id="lkLogo">
            ${S.club.logoUrl ? `<option value="club"${t.logoUrl === S.club.logoUrl ? ' selected' : ''}>Club logo</option>` : ''}
            ${t.logoUrl && t.logoUrl !== S.club.logoUrl ? '<option value="keep" selected>Its own logo</option>' : ''}
            <option value="upload">Upload a logo for this team…</option>
            <option value="none"${!t.logoUrl ? ' selected' : ''}>No logo</option></select></div>
          <input id="lkFile" type="file" accept="image/png,image/jpeg,image/webp" class="hide" aria-label="Team logo file">
          <p class="muted" style="margin:0;font-size:13px;line-height:1.45;">${sameColor(t.color, S.club.color) && (!t.logoUrl || t.logoUrl === S.club.logoUrl) ? 'This team uses the club look, so it changes when the club\'s does.' : 'This team has its own look. Club changes leave it alone.'} Coaches can change these in the app too.</p>
          <button class="btn dark" type="button" id="lkGo">Save colors and logo</button>
        </section>
        <section class="card pad" style="display:flex;flex-direction:column;gap:10px;font-size:14px;">
          <h2 style="font-size:16px;font-weight:800;">This team</h2>
          <p class="muted" style="margin:0;line-height:1.45;">Taking a team out of the club never deletes it or its history.</p>
          <button class="btn ghost" type="button" id="rmTeam">Take out of the club…</button>
        </section>
      </aside>
    </div>`;
  $('backAll').onclick = (e) => { e.preventDefault(); S.teamId = null; setUrl(); render(); };
  let role = 'coach';
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { role = b.dataset.role; document.querySelectorAll('[data-role]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('iGo').onclick = (ev) => busy(ev.currentTarget, async () => {
    const email = $('iEm').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('That email doesn\'t look right.');
    await invite(t, email, role); $('iEm').value = ''; toast(`Invite sent to ${email}.`); loadStaff(t);
  });
  $('rmTeam').onclick = () => removeTeamDialog(t);
  $('lkLogo').onchange = () => { if ($('lkLogo').value === 'upload') $('lkFile').click(); };
  $('lkGo').onclick = (ev) => busy(ev.currentTarget, async () => {
    const v = $('lkLogo').value;
    let logo;
    if (v === 'upload') { logo = await logoDataUrl($('lkFile').files[0]); if (!logo) return toast('Choose an image for the logo first.'); }
    else if (v === 'club' || v === 'none') logo = v;
    const r = await call('clubSetTeamLook', { clubId: S.clubId, teamId: t.id, color: $('lkC1').value, color2: $('lkC2').value, logo });
    const s2 = await getDoc(doc(db, 'teams', t.id)); if (s2.exists()) S.teams[t.id] = { id: t.id, ...s2.data() };
    toast(r.changed ? 'Saved. Phones pick it up within a minute.' : 'Nothing changed.'); render();
  });
  loadStaff(t);
}

/** Same invitation shape the apps write (TeamHubManager.upsertInvitation), plus the club. */
async function invite(t, email, role) {
  const old = await getDocs(query(collection(db, 'invitations'), where('email', '==', email), where('teamId', '==', t.id), where('status', '==', 'pending')));
  for (const d of old.docs) { try { await deleteDoc(d.ref); } catch (_) {} }
  await addDoc(collection(db, 'invitations'), {
    email, teamId: t.id, teamName: t.name, hubCode: t.hub?.hubCode || '', sport: t.sport || '', color: t.color || '',
    role, inviterName: S.user.displayName || S.user.email || 'Club director', inviterUid: S.user.uid, inviteeName: '',
    clubId: S.clubId, clubName: S.club.name, date: Date.now(), status: 'pending',
  });
}

async function loadStaff(t) {
  const box = $('staff'); if (!box) return;
  try {
    const [m, c, inv] = await Promise.all([
      getDocs(collection(db, 'teams', t.id, 'managers')), getDocs(collection(db, 'teams', t.id, 'coaches')),
      getDocs(query(collection(db, 'invitations'), where('teamId', '==', t.id), where('status', '==', 'pending'))),
    ]);
    const people = new Map();
    m.docs.forEach(d => people.set(d.id, { uid: d.id, name: d.data().name || d.data().displayName || '', email: d.data().email || '', role: d.data().role === 'owner' ? 'owner' : 'manager', coll: 'managers' }));
    c.docs.forEach(d => { if (!people.has(d.id)) people.set(d.id, { uid: d.id, name: d.data().displayName || d.data().name || '', email: d.data().email || '', role: 'coach', coll: 'coaches' }); });
    const list = [...people.values()].sort((a, b) => (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : (a.name || a.email).localeCompare(b.name || b.email)));
    const roleWord = { owner: 'Club director', manager: 'Manager', coach: 'Coach' };
    box.innerHTML = list.map(p => `<div class="person">
        <div class="avatar">${esc(initials(p.name || p.email))}</div>
        <div style="flex:1 1 auto;min-width:0;"><div style="font-weight:700;">${esc(p.name || p.email || 'Staff member')}</div><div class="muted" style="font-size:13px;">${esc(roleWord[p.role])}${p.email ? ' · ' + esc(p.email) : ''}</div></div>
        ${p.role === 'owner' ? '' : `<button class="btn link" type="button" data-rm="${esc(p.uid)}" data-coll="${p.coll}">Remove</button>`}
      </div>`).join('')
      + inv.docs.map(d => { const x = d.data(); return `<div class="person">
        <div class="avatar">✉</div>
        <div style="flex:1 1 auto;min-width:0;"><div style="font-weight:700;">${esc(x.email)}</div><div class="muted" style="font-size:13px;">${x.role === 'manager' ? 'Manager' : 'Coach'} · invited ${new Date(x.date || 0).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, waiting to accept</div></div>
        <button class="btn link" type="button" data-resend="${esc(d.id)}">Resend</button><button class="btn link" type="button" data-cancel="${esc(d.id)}">Cancel</button>
      </div>`; }).join('')
      || '<div class="pad muted">No staff yet.</div>';
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => busy(b, async () => {
      if (!confirm('Remove this person from the team? They lose Pro on it straight away.')) return;
      await deleteDoc(doc(db, 'teams', t.id, b.dataset.coll, b.dataset.rm));
      if (b.dataset.coll === 'managers') { try { await deleteDoc(doc(db, 'teams', t.id, 'coaches', b.dataset.rm)); } catch (_) {} }
      else { try { await deleteDoc(doc(db, 'teams', t.id, 'managers', b.dataset.rm)); } catch (_) {} }
      toast('Removed.'); loadStaff(t);
    }));
    box.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => busy(b, async () => { await deleteDoc(doc(db, 'invitations', b.dataset.cancel)); loadStaff(t); }));
    box.querySelectorAll('[data-resend]').forEach(b => b.onclick = () => busy(b, async () => {
      const x = inv.docs.find(d => d.id === b.dataset.resend).data(); await invite(t, x.email, x.role); toast(`Sent again to ${x.email}.`); loadStaff(t);
    }));
  } catch (e) { box.innerHTML = `<div class="pad muted">Couldn't load staff: ${esc(errText(e))}</div>`; }
}

async function removeTeamDialog(t) {
  const [m, c] = await Promise.all([getDocs(collection(db, 'teams', t.id, 'managers')), getDocs(collection(db, 'teams', t.id, 'coaches'))]);
  const staff = new Map();
  [...m.docs, ...c.docs].forEach(d => { const x = d.data(); if (x.role !== 'owner' && d.id !== t.ownerUid) staff.set(d.id, x.name || x.displayName || x.email || 'Staff member'); });
  const d = $('dlg');
  d.innerHTML = `<form method="dialog">
    <h2 style="font-size:20px;font-weight:800;">Take ${esc(t.name)} out of the club</h2>
    <p class="muted" style="margin:0;line-height:1.45;">Its page, games and history stay. Its staff lose the club's Pro on it.</p>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:500;"><input type="radio" name="then" value="transfer" ${staff.size ? 'checked' : 'disabled'}> <span>Hand it to one of its coaches${staff.size ? '' : ' (it has none yet)'}</span></label>
    ${staff.size ? `<div class="field" style="margin-left:28px;"><label for="toUid">New owner</label><select id="toUid">${[...staff].map(([uid, n]) => `<option value="${esc(uid)}">${esc(n)}</option>`).join('')}</select></div>` : ''}
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:500;"><input type="radio" name="then" value="archive" ${staff.size ? '' : 'checked'}> <span>Archive it</span></label>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:500;"><input type="radio" name="then" value="keep"> <span>Keep it on my own account</span></label>
    <div class="row"><button class="btn dark" value="ok" id="rmGo">Take it out</button><button class="btn ghost" value="cancel" formnovalidate>Cancel</button></div>

  }); };

function currentBase() {

  return S.licenses.filter(l => ['paid', 'comp', 'awaiting_payment', 'processing'].includes(l.state) && l.start <= now && l.end > now).sort((a, b) => b.end - a.end)[0];
}

  const c = S.club; const B = S.buy; const base = currentBase();
  const active = (c.teamIds || []).filter(id => S.teams[id] && S.teams[id].status !== 'archived').length;

        </div>`}
        <div class="field"><div class="eyebrow">${B.kind === 'addon' ? '2' : '3'} · How you pay</div>

        <div class="eyebrow" style="color:var(--deep-mu);">Summary</div>
        <div id="sumBody"><div style="color:var(--deep-mu);">Pricing…</div></div>

      </tbody></table></div>` : '<div class="pad muted">Nothing yet.</div>'}

  document.querySelectorAll('[data-void]').forEach(b => b.onclick = () => busy(b, async () => {

  });

}

let qTimer = null, qSeq = 0;
function requote(now) {
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    const B = S.buy; const seq = ++qSeq; const box = $('sumBody'); if (!box) return;
    try {
      const data = B.kind === 'addon' ? { clubId: S.clubId, kind: 'addon', teams: B.teams } : { clubId: S.clubId, teams: B.teams, months: B.months, startDate: B.start };
      const q = await call('clubQuote', data);
      if (seq !== qSeq) return; B.quote = q; B.qerr = '';
    } catch (e) { if (seq !== qSeq) return; B.quote = null; B.qerr = errText(e); }
    drawSummary();
  }, now ? 0 : 250);
}
function drawSummary() {
  const B = S.buy; const q = B.quote; const box = $('sumBody'); if (!box) return;
  if (!q) { box.innerHTML = `<div style="color:#FFB4B4;font-size:15px;">${esc(B.qerr || 'Couldn\'t price that.')}</div>`; return; }
  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:22px;font-weight:800;">${q.teams} team${q.teams === 1 ? '' : 's'} ${q.kind === 'addon' ? `· ${q.days} days` : `× ${q.months} month${q.months === 1 ? '' : 's'}`}</div>
    <div style="color:var(--deep-mu);font-size:14px;">${fmtYmd(q.startDate)} – ${fmtYmd(addDaysYmd(q.endDate, -1))}</div>
    <hr>
    <div class="ln"><span>Per team, per month</span><span>${money(q.perTeamMonthCents, q.currency)}</span></div>
    ${q.listCents && q.perTeamMonthCents < q.listCents ? `<div class="ln"><span>You save vs ${money(q.listCents, q.currency)} a month</span><span style="color:#39D98A;">${money((q.listCents - q.perTeamMonthCents) * q.teams * (q.kind === 'addon' ? q.days * 12 / 365 : q.months), q.currency)}</span></div>` : ''}
    <div class="ln"><span>Sales tax</span><span>${B.pay === 'invoice' ? 'On the invoice' : 'At checkout'}</span></div>
    <hr>
    <div class="ln" style="align-items:baseline;"><span style="color:var(--deep-tx);">Total</span><span style="font-size:30px;font-weight:900;">${money(q.subtotalCents, q.currency)}</span></div>
    <button class="btn primary" type="button" id="payGo">Review purchase</button>
    <div style="font-size:12px;color:var(--deep-mu);line-height:1.5;">Payments by Stripe. ${B.pay === 'invoice' ? `The invoice goes to ${esc(S.club.billing?.email || 'your billing email')}.` : 'Card, or a US bank account.'} Teams keep their pages and history if you don't renew.</div>
  </div>`;
  $('payGo').onclick = () => reviewPurchase();
}

// The step where the club actually buys (Eric 2026-10-29: "it wasn't clear
// that's when I was actually signing up for service. I want it to be super
// clear"). Says what is bought, for which dates, what it costs, when it's due
// and what happens if it isn't paid; a tick confirms it; the result stays on
// screen with the invoice link instead of a toast.
function reviewPurchase() {
  const B = S.buy, q = B.quote; if (!q) return;
  const inv = B.pay === 'invoice', t = q.invoiceTerms || {};
  const d = $('dlg');
  const email = (S.club.billing && S.club.billing.email) || '';
  const today = ymdOf(Date.now());
  const due = addDaysYmd(today, t.daysUntilDue || 30), stop = addDaysYmd(due, t.graceDays || 14);
  const nowTeams = t.provisionalTeams == null ? q.teams : Math.min(q.teams, t.provisionalTeams);
  const what = q.kind === 'addon' ? `${q.teams} more team license${q.teams === 1 ? '' : 's'}` : `${q.teams} team license${q.teams === 1 ? '' : 's'} for ${q.months} month${q.months === 1 ? '' : 's'}`;
  const data = B.kind === 'addon' ? { clubId: S.clubId, kind: 'addon', teams: B.teams } : { clubId: S.clubId, teams: B.teams, months: B.months, startDate: B.start };
  let working = false;
  const ln = (a, b, strong) => `<div class="ln" style="display:flex;justify-content:space-between;gap:12px;${strong ? 'font-weight:800;font-size:17px;' : ''}"><span>${a}</span><span>${b}</span></div>`;
  d.innerHTML = `<form method="dialog" style="width:auto;">
    <h2 style="font-size:21px;font-weight:900;">Review your purchase</h2>
    <p class="muted" style="margin:0;line-height:1.5;font-size:14px;">You're buying ScoreFrame club licenses for <strong>${esc(S.club.name)}</strong>. ${inv ? 'Nothing is charged today: we email an invoice.' : 'You pay on the next page, on Stripe.'}</p>
    <div style="display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line, #ddd);border-radius:12px;font-size:15px;">
      ${ln('What', esc(what))}
      ${ln('Dates', `${fmtYmd(q.startDate)} – ${fmtYmd(addDaysYmd(q.endDate, -1))}`)}
      ${ln('Per team, per month', money(q.perTeamMonthCents, q.currency))}
      ${ln('Total', `${money(q.subtotalCents, q.currency)}<span class="muted" style="font-weight:500;font-size:13px;"> + sales tax if it applies</span>`, true)}
    </div>
    <ul style="margin:0;padding-left:20px;line-height:1.55;font-size:14px;color:var(--ink);">
      ${inv ? `<li>The invoice goes to <strong>${esc(email || 'your billing email')}</strong>${B.po ? ` with PO ${esc(B.po)}` : ''}. It's due <strong>${fmtYmd(due)}</strong>.</li>
      <li>${nowTeams < q.teams ? `<strong>${nowTeams} of the ${q.teams} teams</strong> can be used now; all ${q.teams} once it's paid.` : `All ${q.teams} teams can be used now.`}</li>
      <li>If it isn't paid by <strong>${fmtYmd(stop)}</strong>, the unpaid teams stop recording as Pro that day. Team pages and history stay.</li>
      <li>Pay by card, bank account or bank transfer from the invoice, or by check.</li>`
      : `<li>The teams can be used as soon as the payment goes through.</li><li>A receipt goes to ${esc(email || 'your billing email')}.</li>`}
      <li>No automatic renewal: we remind you before it ends.</li>
    </ul>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:500;line-height:1.45;"><input type="checkbox" id="rvOk" style="margin-top:3px;"> <span>I'm buying these licenses for ${esc(S.club.name)} under the <a href="/club-terms.html" target="_blank" rel="noopener">Club Terms</a>.</span></label>
    <div class="row"><button class="btn primary" value="ok" id="rvGo">${inv ? 'Buy and email the invoice' : 'Buy and pay now'}</button><button class="btn ghost" value="cancel" id="rvBack" formnovalidate>Back</button></div>
    <div id="rvMsg" style="font-size:14px;line-height:1.5;" role="status" aria-live="polite"></div>
  </form>`;
  d.style.width = 'min(560px, calc(100% - 32px))';
  d.addEventListener('close', () => { d.style.width = ''; }, { once: true });
  d.oncancel = (e) => { if (working) e.preventDefault(); };
  d.showModal();
  $('rvGo').onclick = async (ev) => {
    ev.preventDefault();
    const msg = $('rvMsg'), go = $('rvGo');
    if (!$('rvOk').checked) { msg.textContent = 'Tick the box to confirm the purchase.'; return; }
    working = true; go.disabled = true; $('rvBack').disabled = true;
    go.textContent = inv ? 'Creating your invoice…' : 'Opening Stripe…';
    msg.textContent = inv ? 'Creating the invoice and emailing it. This takes a few seconds; keep this page open.' : 'Taking you to Stripe\'s secure payment page.';
    try {
      if (!inv) { const r = await call('clubCheckout', data); location.href = r.url; return; }
      const r = await call('clubSendInvoice', { ...data, po: B.po });
      B.quote = null; B.teams = 0; working = false;
      const covered = r.coveredNow != null ? r.coveredNow : nowTeams;
      d.querySelector('form').innerHTML = `
        <h2 style="font-size:21px;font-weight:900;">Purchase made</h2>
        <p style="margin:0;line-height:1.55;font-size:15px;color:var(--ink);">Invoice <strong>${esc(r.invoiceNumber || '')}</strong> for <strong>${money(r.totalCents != null ? r.totalCents : q.subtotalCents, q.currency)}</strong> was emailed to <strong>${esc(r.email || email || 'your billing email')}</strong>. It's due <strong>${fmtYmd(r.dueDate)}</strong>.</p>
        <p style="margin:0;line-height:1.55;font-size:15px;color:var(--ink);">${covered < (r.teams || q.teams) ? `${covered} teams can be used now; all ${r.teams || q.teams} once it's paid.` : `All ${r.teams || q.teams} teams can be used now.`}</p>
        <div class="row">${r.hostedInvoiceUrl ? `<a class="btn primary" href="${esc(r.hostedInvoiceUrl)}" target="_blank" rel="noopener">Open the invoice</a>` : ''}<button class="btn ghost" value="ok">Done</button></div>`;
      render();
    } catch (e) {
      working = false; go.disabled = false; $('rvBack').disabled = false;
      go.textContent = inv ? 'Buy and email the invoice' : 'Buy and pay now';
      msg.innerHTML = `<span style="color:#B42318;font-weight:600;">The purchase didn't go through: ${esc(errText(e))}</span>`;
    }
  };
}

// ── Club details ─────────────────────────────────────────────────────
// ── YouTube (club_youtube.js) ────────────────────────────────────────
const ytChannels = () => ((S.club && S.club.youtube && S.club.youtube.channels) || []);
const fmtWhen = (ms) => new Date(ms).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function ytStatus(x) {
  if (x.status === 'ready') return ['<span class="status s-ok">Ready to go live</span>', ''];
  if (x.status === 'reconnect') return ['<span class="status s-bad">Reconnect needed</span>',
    "ScoreFrame lost access to this channel (a password change or removed access does that). Coaches can't go live until you reconnect it."];
  const by = x.waitingSince ? ` YouTube's first-time wait is 24 hours, so it should be ready around ${esc(fmtWhen(x.waitingSince + 24 * 3600e3))}.` : '';
  return ['<span class="status s-warn">Waiting on YouTube</span>',
    `This channel can't go live yet. On YouTube, turn on live streaming at <a href="https://www.youtube.com/features" target="_blank" rel="noopener">youtube.com/features</a> (it asks for a phone number).${by} We check again whenever you open this page or a coach goes live.`];
}
function ytSection() {
  const ch = ytChannels(); const y = (S.club && S.club.youtube) || {};
  const rows = teamRows().filter(r => r.t.status !== 'archived');
  const def = y.defaultChannelId || (ch[0] && ch[0].id);
  const opt = (id, sel) => `<option value="${esc(id)}"${id === sel ? ' selected' : ''}>${esc((ch.find(x => x.id === id) || {}).title || id)}</option>`;
  return `<section class="card pad" id="ytCard" style="max-width:640px;display:flex;flex-direction:column;gap:12px;">
    <h2 style="font-size:20px;font-weight:800;">YouTube</h2>
    <p class="muted" style="margin:0;line-height:1.5;">Your teams' live games go to the club's own YouTube channel. Connect it once here. Coaches never sign in to YouTube for club teams and can't change where a team streams.</p>
    ${ch.map(x => { const [pill, note] = ytStatus(x); return `<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--ln2);padding-top:12px;">
      <div class="row" style="gap:12px;">
        ${x.thumb ? `<img src="${esc(x.thumb)}" alt="" width="40" height="40" style="border-radius:50%;flex:none;">` : ''}
        <div style="flex:1 1 200px;min-width:0;"><div style="font-weight:700;overflow-wrap:anywhere;">${esc(x.title)}${ch.length > 1 && x.id === def ? ' <span class="muted" style="font-weight:400;">(club default)</span>' : ''}</div>
          <div class="muted" style="font-size:13px;">Connected ${x.connectedAt ? new Date(x.connectedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''}${x.connectedByName ? ` by ${esc(x.connectedByName)}` : ''}</div></div>
        ${pill}
      </div>
      ${note ? `<div class="muted" style="font-size:13px;line-height:1.45;">${note}</div>` : ''}
      <div class="row" style="gap:8px;">
        ${x.status === 'reconnect' ? '<button class="btn primary" type="button" data-ytconnect>Reconnect</button>' : `<button class="btn ghost" type="button" data-ytcheck="${esc(x.id)}">Check again</button>`}
        <button class="btn link" type="button" data-ytdrop="${esc(x.id)}" data-yttitle="${esc(x.title)}">Disconnect</button>
      </div></div>`; }).join('')}
    ${ch.length > 1 ? `<div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ln2);padding-top:12px;">
      <div class="field"><label for="ytDef">Club default</label><select id="ytDef">${ch.map(x => opt(x.id, def)).join('')}</select></div>
      ${rows.length ? `<div style="font-weight:700;">Each team</div>${rows.map(r => `<div class="row" style="gap:10px;"><div style="flex:1 1 180px;min-width:0;overflow-wrap:anywhere;">${esc(r.t.name)}</div>
        <select data-ytteam="${esc(r.id)}" aria-label="YouTube channel for ${esc(r.t.name)}" style="flex:1 1 200px;"><option value="">Club default</option>${ch.map(x => opt(x.id, (y.teamChannels || {})[r.id] || '')).join('')}</select></div>`).join('')}` : ''}
    </div>` : ''}
    <div class="row" style="gap:10px;"><button class="btn ${ch.length ? 'ghost' : 'primary'}" type="button" data-ytconnect>${ch.length ? 'Connect another channel' : 'Connect YouTube'}</button></div>
    <div class="banner b-info" style="font-size:13px;"><div class="txt" style="line-height:1.5;">
      <strong>Before you connect:</strong> the club needs its own YouTube channel. Google's screen lists every channel your Google account owns or manages, including brand channels; pick the club's. Leave the YouTube box ticked so ScoreFrame can start streams on it.<br>
      <strong>New channels:</strong> YouTube makes a channel wait 24 hours after live streaming is first turned on. Connect a few days before your first game.<br>
      The channel's owner controls its videos and who can watch them (public, unlisted or private).</div></div>
  </section>`;
}
function wireYouTube() {
  const card = $('ytCard'); if (!card) return;
  if (S.ytFocus) { S.ytFocus = false; setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
  card.querySelectorAll('[data-ytconnect]').forEach(b => b.onclick = () => busy(b, async () => {
    const r = await call('clubYouTubeAuthUrl', { clubId: S.clubId });
    location.href = r.url;
  }));
  card.querySelectorAll('[data-ytcheck]').forEach(b => b.onclick = () => busy(b, async () => {
    const r = await call('clubYouTubeCheck', { clubId: S.clubId, channelId: b.dataset.ytcheck });
    const x = (r.channels || [])[0];
    toast(!x ? 'Checked.' : x.status === 'ready' ? `${x.title} can go live.` : x.status === 'reconnect' ? `${x.title} needs reconnecting.` : `${x.title} still can't go live. YouTube hasn't turned live streaming on yet.`, 6000);
  }));
  card.querySelectorAll('[data-ytdrop]').forEach(b => b.onclick = () => busy(b, async () => {
    if (!confirm(`Disconnect ${b.dataset.yttitle}? Teams streaming to it move to the club default. If it's the only channel, coaches can't go live until you connect one.`)) return;
    await call('clubYouTubeDisconnect', { clubId: S.clubId, channelId: b.dataset.ytdrop });
    toast('Disconnected.');
  }));
  // The select already shows the pick: saved now, put back if the server says no.
  const ytSave = (sel, label, payload) => {
    const prev = ([...sel.options].find(o => o.defaultSelected) || sel.options[0] || {}).value || '';
    toast('Saved.');
    call('clubYouTubeSetTeams', { clubId: S.clubId, ...payload }).then(() => {
      [...sel.options].forEach(o => { o.defaultSelected = o.selected; });
    }).catch((e) => {
      sel.value = prev;
      const id = sel.id || '', team = sel.dataset.ytteam || '';
      failToast(`${label} didn't save: ${errText(e)}.`, () => {
        const el = id ? $(id) : document.querySelector(`[data-ytteam="${team}"]`);
        if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus(); }
      });
    });
  };
  const def = $('ytDef'); if (def) def.onchange = () => ytSave(def, 'The club default channel', { defaultChannelId: def.value });
  card.querySelectorAll('[data-ytteam]').forEach(sel => sel.onchange = () =>
    ytSave(sel, 'The channel for that team', { teamId: sel.dataset.ytteam, channelId: sel.value || null }));
  // A channel still waiting on YouTube: look again (once per visit, at most every 10 minutes).
  const stale = ytChannels().filter(x => x.status === 'waiting' && (!x.checkedAt || Date.now() - x.checkedAt > 10 * 60e3));
  if (stale.length && !S.ytChecked) { S.ytChecked = true; call('clubYouTubeCheck', { clubId: S.clubId }).catch(() => {}); }
}
function renderSettings() {
  const c = S.club;
  $('main').innerHTML = `${clubHeader()}
    <section class="card pad" style="max-width:640px;display:flex;flex-direction:column;gap:14px;">
      <h2 style="font-size:20px;font-weight:800;">Club details</h2>
      <div class="field"><label for="sName">Club name</label><input id="sName" maxlength="80" value="${esc(c.name)}"></div>
      <div class="field"><label for="sCity">City</label><input id="sCity" maxlength="80" value="${esc(c.city || '')}"></div>
      <div class="field"><label for="sOrg">Name on invoices</label><input id="sOrg" maxlength="120" value="${esc(c.billing?.name || '')}"></div>
      <div class="field"><label for="sBill">Billing email</label><input id="sBill" type="email" maxlength="120" value="${esc(c.billing?.email || '')}"></div>
      <div><button class="btn primary" type="button" id="sGo">Save</button></div>
    </section>
    <section class="card pad" id="dirCard" style="max-width:640px;display:flex;flex-direction:column;gap:12px;">
      <h2 style="font-size:20px;font-weight:800;">Directors</h2>
      <p class="muted" style="margin:0;line-height:1.5;">Directors manage the club's teams, coaches, licenses and billing. A club always keeps at least one, so add another before you leave.</p>
      <div id="dirList" class="muted">Loading directors…</div>
      <div class="row" style="gap:8px;align-items:flex-end;">
        <div class="field" style="flex:1 1 240px;margin:0;"><label for="dirEmail">Invite a director</label><input id="dirEmail" type="email" maxlength="160" placeholder="name@example.com"></div>
        <button class="btn primary" type="button" id="dirInvite">Send invite</button>
      </div>
    </section>
    <section class="card pad" id="dataCard" style="max-width:640px;display:flex;flex-direction:column;gap:12px;">
      <h2 style="font-size:20px;font-weight:800;">Your club's data</h2>
      <p class="muted" style="margin:0;line-height:1.5;">Download everything as one file: every team's roster, staff, schedule and games, with links to the videos, as spreadsheets plus a complete copy. It's yours to keep any time, and after a license ends it's kept for a while so you can download it (see the <a href="club-terms.html">Club Terms</a>).</p>
      <div><button class="btn dark" type="button" id="dataBtn">Download your club's data</button></div>
    </section>
    <section class="card pad" style="max-width:640px;display:flex;flex-direction:column;gap:12px;">
      <h2 style="font-size:20px;font-weight:800;">Privacy and terms</h2>
      <div class="row"><div style="flex:1 1 260px;"><div style="font-weight:700;">Who can see your teams</div><div class="muted" style="font-size:14px;">${c.privacyConfirmedAt ? esc(PRIVACY[c.privacy || 'signed_in'].short) : 'Not chosen yet'}</div></div><button class="btn ghost" type="button" id="pvOpen">${c.privacyConfirmedAt ? 'Change' : 'Choose'}</button></div>
      <div class="row"><div style="flex:1 1 260px;"><div style="font-weight:700;">Club Terms</div><div class="muted" style="font-size:14px;">${c.terms && c.terms.acceptedAt ? `Accepted ${new Date(c.terms.acceptedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} by ${esc(c.terms.acceptedByName || c.terms.acceptedByEmail || 'a director')}${termsCurrent(c) ? '' : '. Updated since: please accept the new version.'}` : 'Not accepted yet'}</div></div><a class="btn ghost" href="/club-terms.html" target="_blank" rel="noopener">Read</a>${termsCurrent(c) ? '' : '<button class="btn primary" type="button" id="tmOpen">Accept</button>'}</div>
    </section>
    ${ytSection()}
    <section class="card pad" style="max-width:640px;display:flex;flex-direction:column;gap:14px;">
      <h2 style="font-size:20px;font-weight:800;">Club look</h2>
      <p class="muted" style="margin:0;line-height:1.5;">Every team starts with the club logo and colors. When you change them here, the teams still using the club look change too. A team whose coach or you picked its own keeps it.</p>
      <div class="logobox">
        ${crest(c.logoUrl, c.name, c.color, 72, 16, 'crest', 'font-size:24px;')}
        <div class="row" style="gap:8px;">
          <button class="btn ghost" type="button" id="lgPick">${c.logoUrl ? 'Change logo' : 'Upload logo'}</button>
          ${c.logoUrl ? '<button class="btn link" type="button" id="lgDel">Remove</button>' : ''}
        </div>
        <input id="lgFile" type="file" accept="image/png,image/jpeg,image/webp" class="hide" aria-label="Club logo file">
      </div>
      <p class="muted" style="margin:0;font-size:13px;">Square works best, at least 256 pixels. A transparent background looks right on every team color.</p>
      <div class="grid2">
        <div class="field"><label for="sColor">Main color</label><input id="sColor" type="color" value="${esc(c.color || '#C8102E')}" style="height:44px;padding:4px;"></div>
        <div class="field"><label for="sColor2">Second color</label><input id="sColor2" type="color" value="${esc(c.color2 || '#FFFFFF')}" style="height:44px;padding:4px;"></div>
      </div>
      <div class="row" style="gap:10px;"><button class="btn primary" type="button" id="lkSave">Save colors</button>
        <button class="btn ghost" type="button" id="lkAll">Use the club look on every team…</button></div>
    </section>`;
  $('pvOpen').onclick = () => privacyDialog();
  if ($('tmOpen')) $('tmOpen').onclick = () => termsDialog();
  wireYouTube();
  loadDirectors();
  $('dirInvite').onclick = (ev) => busy(ev.currentTarget, async () => {
    const email = $('dirEmail').value.trim(); if (!email) return toast('Enter their email.');
    await call('clubDirectorInvite', { clubId: S.clubId, email });
    $('dirEmail').value = ''; toast(`Invitation sent to ${email}.`); loadDirectors();
  });
  $('lgPick').onclick = () => $('lgFile').click();
  $('lgFile').onchange = () => busy($('lgPick'), async () => {
    const img = await logoDataUrl($('lgFile').files[0]); if (!img) return;
    const r = await call('clubSetLogo', { clubId: S.clubId, image: img });
    toast(`Logo saved${r.teamsUpdated ? `; ${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'} updated` : ''}.`); await loadClubs(); renderWho();
  });
  if ($('lgDel')) $('lgDel').onclick = (ev) => busy(ev.currentTarget, async () => {
    if (!confirm('Remove the club logo? Teams using it go back to no logo; teams with their own keep theirs.')) return;
    const r = await call('clubSetLogo', { clubId: S.clubId, image: null });
    toast(`Logo removed${r.teamsUpdated ? ` from ${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'}` : ''}.`); await loadClubs(); renderWho();
  });
  $('lkSave').onclick = (ev) => busy(ev.currentTarget, async () => {
    const r = await call('clubUpdate', { clubId: S.clubId, color: $('sColor').value, color2: $('sColor2').value });
    toast(`Colors saved${r.teamsUpdated ? `; ${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'} updated` : ''}.`);
  });
  $('lkAll').onclick = (ev) => busy(ev.currentTarget, async () => {
    if (!confirm('Put the club logo and colors on every team, including teams that picked their own?')) return;
    const r = await call('clubApplyLook', { clubId: S.clubId, logo: true, colors: true });
    await loadTeams(); toast(r.teamsUpdated ? `${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'} updated.` : 'Every team already uses the club look.');
  });
  $('dataBtn').onclick = (ev) => busy(ev.currentTarget, async () => {
    const r = await call('clubExport', { clubId: S.clubId });
    toast(`Downloading ${r.teams} team${r.teams === 1 ? '' : 's'} and ${r.games} game${r.games === 1 ? '' : 's'}.`, 6000);
    location.href = r.url;
  });
  if (S.dataFocus) { S.dataFocus = false; setTimeout(() => $('dataCard')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); }
  $('sGo').onclick = (ev) => busy(ev.currentTarget, async () => {
    await call('clubUpdate', { clubId: S.clubId, name: $('sName').value, city: $('sCity').value, orgName: $('sOrg').value, billingEmail: $('sBill').value });
    toast('Saved.'); await loadClubs(); renderWho();
  });
}
</script>
