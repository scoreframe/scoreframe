.failtoast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #B42318; color: #fff; padding: 10px 8px 10px 16px; border-radius: 10px; font-size: 14px; line-height: 1.4; z-index: 21; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; align-items: center; gap: 8px; cursor: pointer; }
.failtoast button { background: none; border: 0; color: #fff; font-size: 18px; line-height: 1; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
.failtoast button:focus-visible { outline: 2px solid #fff; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }

dialog form { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.hero { border-radius: 16px; padding: 22px; color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.person { display: flex; align-items: center; gap: 14px; padding: 13px 22px; border-top: 1px solid var(--ln2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #ECECE8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.hide { display: none !important; }
.signin { max-width: 440px; margin: 40px auto; text-align: center; display: flex; flex-direction: column; gap: 14px; }
.signin input { width: 100%; }
.loading { padding: 60px 0; text-align: center; color: var(--mu); }
@media (max-width: 720px) {
  .stats3 { grid-template-columns: 1fr; gap: 16px; }
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  nav.tabs { margin-left: 0; order: 3; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<header class="top">
  <a class="brand" href="/"><img class="tile" src="/apple-touch-icon.png" alt="" width="30" height="30" style="object-fit:cover;"><span class="word">Score<b>Frame</b></span></a>
  <span class="pill-club">CLUB</span>
  <nav class="tabs hide" id="tabs" aria-label="Club sections">
    <button type="button" data-tab="teams">Teams</button>
    <button type="button" data-tab="billing">License &amp; billing</button>
    <button type="button" data-tab="tournaments">Tournaments</button>
    <button type="button" data-tab="settings">Club details</button>
  </nav>
  <div class="who" id="who"></div>
</header>
<main id="main"><div class="loading">Loading…</div></main>

<dialog id="dlg"></dialog>
<div class="toast hide" id="toast" role="status" aria-live="polite"></div>
<div class="failtoast hide" id="failToast" role="alert"><span id="failMsg"></span><button type="button" id="failX" aria-label="Dismiss">✕</button></div>

<script type="module">

  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile,
  setPersistence, browserLocalPersistence, sendPasswordResetEmail }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const app = initializeApp({
  apiKey: "AIzaSyBhqtlHshe3wEEPkJe7mVUIrZ1IJirullU", authDomain: "scoreframe-deploy.firebaseapp.com",
  databaseURL: "https://scoreframe-deploy-default-rtdb.firebaseio.com", projectId: "scoreframe-deploy",
  storageBucket: "scoreframe-deploy.firebasestorage.app", messagingSenderId: "728886280072",
  appId: "1:728886280072:android:0050478669b89fc76b043d"
});
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(() => {});
const fns = getFunctions(app);
const call = (name, data) => httpsCallable(fns, name)(data).then(r => r.data);
const google = new GoogleAuthProvider(); google.setCustomParameters({ prompt: 'select_account' });
const ua = navigator.userAgent || '';
const useRedirect = /iP(hone|ad|od)|Safari/i.test(ua) && !/Chrome|CriOS|FxiOS/i.test(ua);
getRedirectResult(auth).catch(() => {});

// ── Helpers ──────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const SPORTS = { VOLLEYBALL: 'Volleyball', BASKETBALL: 'Basketball', SOCCER: 'Soccer', BASEBALL: 'Baseball', SOFTBALL: 'Softball',
  FOOTBALL: 'Football', HOCKEY: 'Hockey', LACROSSE: 'Lacrosse', BOWLING: 'Bowling', TENNIS: 'Tennis', PICKLEBALL: 'Pickleball', GENERIC: 'Other' };
const fmtYmd = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); };
const ymdOf = (ms) => new Date(ms).toISOString().slice(0, 10);
const addDaysYmd = (ymd, n) => { const [y, m, d] = ymd.split('-').map(Number); return ymdOf(Date.UTC(y, m - 1, d) + n * DAY); };
/** The last day an `until` covers (server: endMs(Jun 1) = Jun 1 12:00 UTC → May 31). */
const lastDay = (until) => fmtYmd(ymdOf(until - 36 * 3600 * 1000));
/** The exclusive end date as YYYY-MM-DD (a renewal starts here). */
const endYmdOf = (until) => ymdOf(until - 12 * 3600 * 1000);
const daysLeft = (until) => Math.max(0, Math.ceil((until - Date.now()) / DAY));
const money = (cents, cur = 'usd') => new Intl.NumberFormat('en-US', { style: 'currency', currency: cur.toUpperCase() }).format(cents / 100);
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const sameColor = (a, b) => String(a || '').toUpperCase() === String(b || '').toUpperCase();
/** "18U" → "18"; otherwise the name's initials. */
const badge = (age, name) => (String(age || '').match(/\d+/) || [])[0] || initials(name);
const initials = (s) => String(s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
/** A logo when there is one, otherwise initials on the color. */
const crest = (url, label, color, px, radius, cls = 'crest', font = '', text = '') => url && /^https:\/\//.test(url)
  ? `<img class="logo" src="${esc(url)}" alt="" style="width:${px}px;height:${px}px;border-radius:${radius}px;">`
  : `<div class="${cls}" style="width:${px}px;height:${px}px;border-radius:${radius}px;background:${esc(color || '#C8102E')};${font}">${esc(text || initials(label))}</div>`;
/** Reads an image file into a PNG (or WebP when large) data URL, at most 512 px. */
async function logoDataUrl(file) {
  if (!file) return null;
  if (!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)) throw new Error('Use a PNG, JPG or WebP image.');
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("That image couldn't be read.")); i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 512 / Math.max(img.naturalWidth || 512, img.naturalHeight || 512));
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round((img.naturalWidth || 512) * k)); cv.height = Math.max(1, Math.round((img.naturalHeight || 512) * k));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  let url = cv.toDataURL('image/png');
  if (url.length > 1200000) url = cv.toDataURL('image/webp', 0.9);
  return url;
}
const AUTH_ERR = { 'auth/invalid-credential': 'Wrong email or password.', 'auth/wrong-password': 'Wrong email or password.',
  'auth/user-not-found': 'No account with that email. Create one instead.', 'auth/email-already-in-use': 'That email already has an account. Sign in instead.',
  'auth/weak-password': 'Use at least 6 characters for the password.', 'auth/invalid-email': 'That email doesn\'t look right.',
  'auth/too-many-requests': 'Too many tries. Wait a minute and try again.' };
const errText = (e) => (e && AUTH_ERR[e.code]) || (e && e.message ? String(e.message).replace(/^Firebase: /, '') : 'Something went wrong.');
function toast(msg, ms = 4000) { const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hide'), ms); }
// A save shown as done that then failed (Eric 2026-10-29): it stays on screen
// until dismissed, and tapping it goes back to what didn't save.
function failToast(msg, reopen) {
  const t = $('failToast');
  $('failMsg').textContent = msg + (reopen ? ' Tap to fix it.' : '');
  t.classList.remove('hide');
  t.onclick = (e) => { t.classList.add('hide'); if (e.target.id !== 'failX' && reopen) reopen(); };
}
// Instant save, ONLY for picks the server can't reject (a privacy level, the
// terms box, team order, a channel). Typed entries and billing keep waiting
// for the server, so an invalid entry can never look saved. apply() changes
// S and returns its undo; a failure undoes it and leaves a failToast.
function saveNow(label, apply, run, reopen) {
  const undo = apply();
  render();
  run().catch((e) => { undo(); render(); failToast(`${label} didn't save: ${errText(e)}.`, reopen); });
}
async function busy(btn, fn) { const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Working…'; try { return await fn(); } catch (e) { toast(errText(e), 6000); } finally { btn.disabled = false; btn.innerHTML = old; } }

const STATUS = {
  none: ['No license yet', 's-mu'], trialing: ['Free trial', 's-ok'], active: ['Active', 's-ok'],
  awaiting_payment: ['Invoice sent', 's-warn'], past_due: ['Invoice past due', 's-bad'], lapsed: ['Ended', 's-bad'], scheduled: ['Starts soon', 's-warn'],
};
const LSTATE = {

  awaiting_payment: ['Unpaid invoice', 's-warn'], paid: ['Paid', 's-ok'], comp: ['Free (from ScoreFrame)', 's-ok'], trial: ['Trial', 's-ok'], void: ['Canceled', 's-mu'],
};

// ── State ────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const S = { user: null, superUser: false, clubs: [], clubId: params.get('club') || null, club: null, licenses: [], teams: {},
  tab: params.get('tab') || 'teams', teamId: null, unsub: [], buy: { kind: 'purchase', teams: 0, months: 7, start: '', pay: 'card', po: '', quote: null, qerr: '' },

if (S.wantBuy) S.tab = 'billing';
// Back from Google's YouTube sign-in (clubYouTubeAuthUrl sends it here). Take the
// code off the address bar at once so a reload can't reuse it.
const ytReturn = params.get('state') && (params.get('code') || params.get('error'))
  ? { state: params.get('state'), code: params.get('code'), error: params.get('error') } : null;
if (ytReturn) { ['state', 'code', 'error', 'scope', 'authuser', 'prompt', 'hd'].forEach(k => params.delete(k)); history.replaceState(null, '', location.pathname); }
function setUrl() {
  const p = new URLSearchParams();

// ── Auth ─────────────────────────────────────────────────────────────
function renderWho() {

  const pick = $('clubPick');
  if (pick) pick.onchange = () => { if (pick.value === '__new') { S.clubId = null; S.club = null; renderCreate(); } else openClub(pick.value); };

function renderSignIn() {
  $('tabs').classList.add('hide');
  $('main').innerHTML = `

function openClub(clubId) {
  S.unsub.forEach(f => f()); S.unsub = [];
  S.clubId = clubId; S.club = null; S.licenses = []; S.teams = {};
  S.teamId = params.get('team') && S.tab === 'teams' ? params.get('team') : null;
  params.delete('team');
  renderWho(); setUrl();
  $('main').innerHTML = '<div class="loading">Loading the club…</div>';
  // The console refreshes coverage on open, which also picks up teams
  // archived or deleted in the apps since the last daily check.
  call('clubRefresh', { clubId }).catch(() => {});
  S.unsub.push(onSnapshot(doc(db, 'clubs', clubId), async (snap) => {
    if (!snap.exists()) { $('main').innerHTML = '<div class="loading">This club doesn\'t exist or you aren\'t its director.</div>'; return; }
    S.club = { id: snap.id, ...snap.data() };
    const before = S.teamId ? JSON.stringify(S.teams[S.teamId] || null) : null;
    await loadTeams();
    // On a team page, only redraw when that team changed (an invite being typed survives).
    if (S.teamId && document.getElementById('iEm') && JSON.stringify(S.teams[S.teamId] || null) === before) return;
    render();
  }, (e) => { $('main').innerHTML = `<div class="loading">Couldn't open the club: ${esc(errText(e))}</div>`; }));
  S.unsub.push(onSnapshot(collection(db, 'clubs', clubId, 'licenses'), (snap) => {
    S.licenses = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (S.club && !S.teamId) render();

}

async function loadTeams() {
  const ids = S.club.teamIds || [];

function render() {

// ── Tournaments (club canvas board 6) ────────────────────────────────
// One AES link → the tournament on every club team that plays in it, built
// the way the app builds it (clubTournamentCreate). Each team's coaches then
// see and score it in the app; AES fills in the rest every 20 minutes.
const normName = (x) => String(x || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function bestTeamFor(aesName) {
  const a = normName(aesName); const nums = (String(aesName).match(/\d+/g) || []);
  let best = null, score = 0;
  for (const r of teamRows()) {
    const t = normName(r.t.name); let sc = 0;
    if (a.includes(t) || t.includes(a)) sc += 3;
    for (const n of nums) if (String(r.t.name).includes(n) || String(r.t.ageDivision || '').includes(n)) sc += 2;
    for (const w of String(r.t.name).toLowerCase().split(/\s+/)) if (w.length > 2 && a.includes(normName(w))) sc += 1;
    if (sc > score) { score = sc; best = r.id; }
  }
  return score >= 2 ? best : '';

            ${t.logoUrl && t.logoUrl !== S.club.logoUrl ? '<option value="keep" selected>Its own logo</option>' : ''}
            <option value="upload">Upload a logo for this team…</option>
            <option value="none"${!t.logoUrl ? ' selected' : ''}>No logo</option></select></div>
          <input id="lkFile" type="file" accept="image/png,image/jpeg,image/webp" class="hide" aria-label="Team logo file">
          <p class="muted" style="margin:0;font-size:13px;line-height:1.45;">${sameColor(t.color, S.club.color) && (!t.logoUrl || t.logoUrl === S.club.logoUrl) ? 'This team uses the club look, so it changes when the club\'s does.' : 'This team has its own look. Club changes leave it alone.'} Coaches can change these in the app too.</p>
          <button class="btn dark" type="button" id="lkGo">Save colors and logo</button>
        </section>
        <section class="card pad" style="display:flex;flex-direction:column;gap:10px;font-size:14px;">
          <h2 style="font-size:16px;font-weight:800;">This team</h2>
          <p class="muted" style="margin:0;line-height:1.45;">Taking a team out of the club never deletes it or its history.</p>
          <button class="btn ghost" type="button" id="rmTeam">Take out of the club…</button>
        </section>
      </aside>
    </div>`;
  $('backAll').onclick = (e) => { e.preventDefault(); S.teamId = null; setUrl(); render(); };
  let role = 'coach';
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { role = b.dataset.role; document.querySelectorAll('[data-role]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('iGo').onclick = (ev) => busy(ev.currentTarget, async () => {
    const email = $('iEm').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('That email doesn\'t look right.');
    await invite(t, email, role); $('iEm').value = ''; toast(`Invite sent to ${email}.`); loadStaff(t);
  });
  $('rmTeam').onclick = () => removeTeamDialog(t);
  $('lkLogo').onchange = () => { if ($('lkLogo').value === 'upload') $('lkFile').click(); };
  $('lkGo').onclick = (ev) => busy(ev.currentTarget, async () => {
    const v = $('lkLogo').value;
    let logo;
    if (v === 'upload') { logo = await logoDataUrl($('lkFile').files[0]); if (!logo) return toast('Choose an image for the logo first.'); }
    else if (v === 'club' || v === 'none') logo = v;
    const r = await call('clubSetTeamLook', { clubId: S.clubId, teamId: t.id, color: $('lkC1').value, color2: $('lkC2').value, logo });
    const s2 = await getDoc(doc(db, 'teams', t.id)); if (s2.exists()) S.teams[t.id] = { id: t.id, ...s2.data() };
    toast(r.changed ? 'Saved. Phones pick it up within a minute.' : 'Nothing changed.'); render();
  });
  loadStaff(t);
}

/** Same invitation shape the apps write (TeamHubManager.upsertInvitation), plus the club. */
async function invite(t, email, role) {
  const old = await getDocs(query(collection(db, 'invitations'), where('email', '==', email), where('teamId', '==', t.id), where('status', '==', 'pending')));
  for (const d of old.docs) { try { await deleteDoc(d.ref); } catch (_) {} }
  await addDoc(collection(db, 'invitations'), {
    email, teamId: t.id, teamName: t.name, hubCode: t.hub?.hubCode || '', sport: t.sport || '', color: t.color || '',
    role, inviterName: S.user.displayName || S.user.email || 'Club director', inviterUid: S.user.uid, inviteeName: '',
    clubId: S.clubId, clubName: S.club.name, date: Date.now(), status: 'pending',
  });
}

async function loadStaff(t) {
  const box = $('staff'); if (!box) return;
  try {
    const [m, c, inv] = await Promise.all([
      getDocs(collection(db, 'teams', t.id, 'managers')), getDocs(collection(db, 'teams', t.id, 'coaches')),
      getDocs(query(collection(db, 'invitations'), where('teamId', '==', t.id), where('status', '==', 'pending'))),
    ]);
    const people = new Map();
    m.docs.forEach(d => people.set(d.id, { uid: d.id, name: d.data().name || d.data().displayName || '', email: d.data().email || '', role: d.data().role === 'owner' ? 'owner' : 'manager', coll: 'managers' }));
    c.docs.forEach(d => { if (!people.has(d.id)) people.set(d.id, { uid: d.id, name: d.data().displayName || d.data().name || '', email: d.data().email || '', role: 'coach', coll: 'coaches' }); });
    const list = [...people.values()].sort((a, b) => (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : (a.name || a.email).localeCompare(b.name || b.email)));
    const roleWord = { owner: 'Club director', manager: 'Manager', coach: 'Coach' };
    box.innerHTML = list.map(p => `<div class="person">
        <div class="avatar">${esc(initials(p.name || p.email))}</div>
        <div style="flex:1 1 auto;min-width:0;"><div style="font-weight:700;">${esc(p.name || p.email || 'Staff member')}</div><div class="muted" style="font-size:13px;">${esc(roleWord[p.role])}${p.email ? ' · ' + esc(p.email) : ''}</div></div>
        ${p.role === 'owner' ? '' : `<button class="btn link" type="button" data-rm="${esc(p.uid)}" data-coll="${p.coll}">Remove</button>`}
      </div>`).join('')
      + inv.docs.map(d => { const x = d.data(); return `<div class="person">
        <div class="avatar">✉</div>
        <div style="flex:1 1 auto;min-width:0;"><div style="font-weight:700;">${esc(x.email)}</div><div class="muted" style="font-size:13px;">${x.role === 'manager' ? 'Manager' : 'Coach'} · invited ${new Date(x.date || 0).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, waiting to accept</div></div>
        <button class="btn link" type="button" data-resend="${esc(d.id)}">Resend</button><button class="btn link" type="button" data-cancel="${esc(d.id)}">Cancel</button>
      </div>`; }).join('')
      || '<div class="pad muted">No staff yet.</div>';
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => busy(b, async () => {
      if (!confirm('Remove this person from the team? They lose Pro on it straight away.')) return;
      await deleteDoc(doc(db, 'teams', t.id, b.dataset.coll, b.dataset.rm));
      if (b.dataset.coll === 'managers') { try { await deleteDoc(doc(db, 'teams', t.id, 'coaches', b.dataset.rm)); } catch (_) {} }
      else { try { await deleteDoc(doc(db, 'teams', t.id, 'managers', b.dataset.rm)); } catch (_) {} }
      toast('Removed.'); loadStaff(t);
    }));
    box.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => busy(b, async () => { await deleteDoc(doc(db, 'invitations', b.dataset.cancel)); loadStaff(t); }));
    box.querySelectorAll('[data-resend]').forEach(b => b.onclick = () => busy(b, async () => {
      const x = inv.docs.find(d => d.id === b.dataset.resend).data(); await invite(t, x.email, x.role); toast(`Sent again to ${x.email}.`); loadStaff(t);
    }));
  } catch (e) { box.innerHTML = `<div class="pad muted">Couldn't load staff: ${esc(errText(e))}</div>`; }
}

  const [m, c] = await Promise.all([getDocs(collection(db, 'teams', t.id, 'managers')), getDocs(collection(db, 'teams', t.id, 'coaches'))]);

  [...m.docs, ...c.docs].forEach(d => { const x = d.data(); if (x.role !== 'owner' && d.id !== t.ownerUid) staff.set(d.id, x.name || x.displayName || x.email || 'Staff member'); });

    <label style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:500;"><input type="radio" name="then" value="keep"> <span>Keep it on my own account</span></label>

let qTimer = null, qSeq = 0;
function requote(now) {
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => {
    const B = S.buy; const seq = ++qSeq; const box = $('sumBody'); if (!box) return;
    try {
      const data = B.kind === 'addon' ? { clubId: S.clubId, kind: 'addon', teams: B.teams } : { clubId: S.clubId, teams: B.teams, months: B.months, startDate: B.start };
      const q = await call('clubQuote', data);
      if (seq !== qSeq) return; B.quote = q; B.qerr = '';
    } catch (e) { if (seq !== qSeq) return; B.quote = null; B.qerr = errText(e); }
    drawSummary();
  }, now ? 0 : 250);
}
function drawSummary() {
  const B = S.buy; const q = B.quote; const box = $('sumBody'); if (!box) return;
  if (!q) { box.innerHTML = `<div style="color:#FFB4B4;font-size:15px;">${esc(B.qerr || 'Couldn\'t price that.')}</div>`; return; }
  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:22px;font-weight:800;">${q.teams} team${q.teams === 1 ? '' : 's'} ${q.kind === 'addon' ? `· ${q.days} days` : `× ${q.months} month${q.months === 1 ? '' : 's'}`}</div>
    <div style="color:var(--deep-mu);font-size:14px;">${fmtYmd(q.startDate)} – ${fmtYmd(addDaysYmd(q.endDate, -1))}</div>
    <hr>
    <div class="ln"><span>Per team, per month</span><span>${money(q.perTeamMonthCents, q.currency)}</span></div>
    ${q.listCents && q.perTeamMonthCents < q.listCents ? `<div class="ln"><span>You save vs ${money(q.listCents, q.currency)} a month</span><span style="color:#39D98A;">${money((q.listCents - q.perTeamMonthCents) * q.teams * (q.kind === 'addon' ? q.days * 12 / 365 : q.months), q.currency)}</span></div>` : ''}
    <div class="ln"><span>Sales tax</span><span>${B.pay === 'invoice' ? 'On the invoice' : 'At checkout'}</span></div>
    <hr>
    <div class="ln" style="align-items:baseline;"><span style="color:var(--deep-tx);">Total</span><span style="font-size:30px;font-weight:900;">${money(q.subtotalCents, q.currency)}</span></div>
    <button class="btn primary" type="button" id="payGo">${B.pay === 'invoice' ? 'Email the invoice' : 'Continue to payment'}</button>
    <div style="font-size:12px;color:var(--deep-mu);line-height:1.5;">Payments by Stripe. ${B.pay === 'invoice' ? `The invoice goes to ${esc(S.club.billing?.email || 'your billing email')}.` : 'Card, or a US bank account.'} Teams keep their pages and history if you don't renew.</div>
  </div>`;
  $('payGo').onclick = (ev) => busy(ev.currentTarget, async () => {
    const data = B.kind === 'addon' ? { clubId: S.clubId, kind: 'addon', teams: B.teams } : { clubId: S.clubId, teams: B.teams, months: B.months, startDate: B.start };
    if (B.pay === 'invoice') {
      const r = await call('clubSendInvoice', { ...data, po: B.po });
      toast(`Invoice ${r.invoiceNumber || ''} emailed. Due ${fmtYmd(r.dueDate)}. Your teams are covered now.`, 8000);
      B.quote = null; B.teams = 0;
    } else {
      const r = await call('clubCheckout', data);
      location.href = r.url;
    }
  });
}

// ── Club details ─────────────────────────────────────────────────────
// ── YouTube (club_youtube.js) ────────────────────────────────────────
const ytChannels = () => ((S.club && S.club.youtube && S.club.youtube.channels) || []);
const fmtWhen = (ms) => new Date(ms).toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function ytStatus(x) {
  if (x.status === 'ready') return ['<span class="status s-ok">Ready to go live</span>', ''];
  if (x.status === 'reconnect') return ['<span class="status s-bad">Reconnect needed</span>',
    "ScoreFrame lost access to this channel (a password change or removed access does that). Coaches can't go live until you reconnect it."];
  const by = x.waitingSince ? ` YouTube's first-time wait is 24 hours, so it should be ready around ${esc(fmtWhen(x.waitingSince + 24 * 3600e3))}.` : '';
  return ['<span class="status s-warn">Waiting on YouTube</span>',
    `This channel can't go live yet. On YouTube, turn on live streaming at <a href="https://www.youtube.com/features" target="_blank" rel="noopener">youtube.com/features</a> (it asks for a phone number).${by} We check again whenever you open this page or a coach goes live.`];
}
function ytSection() {
  const ch = ytChannels(); const y = (S.club && S.club.youtube) || {};
  const rows = teamRows().filter(r => r.t.status !== 'archived');
  const def = y.defaultChannelId || (ch[0] && ch[0].id);
  const opt = (id, sel) => `<option value="${esc(id)}"${id === sel ? ' selected' : ''}>${esc((ch.find(x => x.id === id) || {}).title || id)}</option>`;
  return `<section class="card pad" id="ytCard" style="max-width:640px;display:flex;flex-direction:column;gap:12px;">
    <h2 style="font-size:20px;font-weight:800;">YouTube</h2>
    <p class="muted" style="margin:0;line-height:1.5;">Your teams' live games go to the club's own YouTube channel. Connect it once here. Coaches never sign in to YouTube for club teams and can't change where a team streams.</p>
    ${ch.map(x => { const [pill, note] = ytStatus(x); return `<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--ln2);padding-top:12px;">
      <div class="row" style="gap:12px;">
        ${x.thumb ? `<img src="${esc(x.thumb)}" alt="" width="40" height="40" style="border-radius:50%;flex:none;">` : ''}
        <div style="flex:1 1 200px;min-width:0;"><div style="font-weight:700;overflow-wrap:anywhere;">${esc(x.title)}${ch.length > 1 && x.id === def ? ' <span class="muted" style="font-weight:400;">(club default)</span>' : ''}</div>
          <div class="muted" style="font-size:13px;">Connected ${x.connectedAt ? new Date(x.connectedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''}${x.connectedByName ? ` by ${esc(x.connectedByName)}` : ''}</div></div>
        ${pill}
      </div>
      ${note ? `<div class="muted" style="font-size:13px;line-height:1.45;">${note}</div>` : ''}
      <div class="row" style="gap:8px;">
        ${x.status === 'reconnect' ? '<button class="btn primary" type="button" data-ytconnect>Reconnect</button>' : `<button class="btn ghost" type="button" data-ytcheck="${esc(x.id)}">Check again</button>`}
        <button class="btn link" type="button" data-ytdrop="${esc(x.id)}" data-yttitle="${esc(x.title)}">Disconnect</button>
      </div></div>`; }).join('')}
    ${ch.length > 1 ? `<div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--ln2);padding-top:12px;">
      <div class="field"><label for="ytDef">Club default</label><select id="ytDef">${ch.map(x => opt(x.id, def)).join('')}</select></div>
      ${rows.length ? `<div style="font-weight:700;">Each team</div>${rows.map(r => `<div class="row" style="gap:10px;"><div style="flex:1 1 180px;min-width:0;overflow-wrap:anywhere;">${esc(r.t.name)}</div>
        <select data-ytteam="${esc(r.id)}" aria-label="YouTube channel for ${esc(r.t.name)}" style="flex:1 1 200px;"><option value="">Club default</option>${ch.map(x => opt(x.id, (y.teamChannels || {})[r.id] || '')).join('')}</select></div>`).join('')}` : ''}
    </div>` : ''}
    <div class="row" style="gap:10px;"><button class="btn ${ch.length ? 'ghost' : 'primary'}" type="button" data-ytconnect>${ch.length ? 'Connect another channel' : 'Connect YouTube'}</button></div>
    <div class="banner b-info" style="font-size:13px;"><div class="txt" style="line-height:1.5;">
      <strong>Before you connect:</strong> the club needs its own YouTube channel. Google's screen lists every channel your Google account owns or manages, including brand channels; pick the club's. Leave the YouTube box ticked so ScoreFrame can start streams on it.<br>
      <strong>New channels:</strong> YouTube makes a channel wait 24 hours after live streaming is first turned on. Connect a few days before your first game.<br>
      The channel's owner controls its videos and who can watch them (public, unlisted or private).</div></div>
  </section>`;
}
function wireYouTube() {
  const card = $('ytCard'); if (!card) return;
  if (S.ytFocus) { S.ytFocus = false; setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
  card.querySelectorAll('[data-ytconnect]').forEach(b => b.onclick = () => busy(b, async () => {
    const r = await call('clubYouTubeAuthUrl', { clubId: S.clubId });
    location.href = r.url;
  }));
  card.querySelectorAll('[data-ytcheck]').forEach(b => b.onclick = () => busy(b, async () => {
    const r = await call('clubYouTubeCheck', { clubId: S.clubId, channelId: b.dataset.ytcheck });
    const x = (r.channels || [])[0];
    toast(!x ? 'Checked.' : x.status === 'ready' ? `${x.title} can go live.` : x.status === 'reconnect' ? `${x.title} needs reconnecting.` : `${x.title} still can't go live. YouTube hasn't turned live streaming on yet.`, 6000);
  }));
  card.querySelectorAll('[data-ytdrop]').forEach(b => b.onclick = () => busy(b, async () => {
    if (!confirm(`Disconnect ${b.dataset.yttitle}? Teams streaming to it move to the club default. If it's the only channel, coaches can't go live until you connect one.`)) return;
    await call('clubYouTubeDisconnect', { clubId: S.clubId, channelId: b.dataset.ytdrop });
    toast('Disconnected.');
  }));
  // The select already shows the pick: saved now, put back if the server says no.
  const ytSave = (sel, label, payload) => {
    const prev = ([...sel.options].find(o => o.defaultSelected) || sel.options[0] || {}).value || '';
    toast('Saved.');
    call('clubYouTubeSetTeams', { clubId: S.clubId, ...payload }).then(() => {
      [...sel.options].forEach(o => { o.defaultSelected = o.selected; });
    }).catch((e) => {
      sel.value = prev;
      const id = sel.id || '', team = sel.dataset.ytteam || '';
      failToast(`${label} didn't save: ${errText(e)}.`, () => {
        const el = id ? $(id) : document.querySelector(`[data-ytteam="${team}"]`);
        if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus(); }
      });
    });
  };
  const def = $('ytDef'); if (def) def.onchange = () => ytSave(def, 'The club default channel', { defaultChannelId: def.value });
  card.querySelectorAll('[data-ytteam]').forEach(sel => sel.onchange = () =>
    ytSave(sel, 'The channel for that team', { teamId: sel.dataset.ytteam, channelId: sel.value || null }));
  // A channel still waiting on YouTube: look again (once per visit, at most every 10 minutes).
  const stale = ytChannels().filter(x => x.status === 'waiting' && (!x.checkedAt || Date.now() - x.checkedAt > 10 * 60e3));
  if (stale.length && !S.ytChecked) { S.ytChecked = true; call('clubYouTubeCheck', { clubId: S.clubId }).catch(() => {}); }
}
function renderSettings() {
  const c = S.club;
  $('main').innerHTML = `${clubHeader()}
    <section class="card pad" style="max-width:640px;display:flex;flex-direction:column;gap:14px;">
      <h2 style="font-size:20px;font-weight:800;">Club details</h2>
      <div class="field"><label for="sName">Club name</label><input id="sName" maxlength="80" value="${esc(c.name)}"></div>
      <div class="field"><label for="sCity">City</label><input id="sCity" maxlength="80" value="${esc(c.city || '')}"></div>
      <div class="field"><label for="sOrg">Name on invoices</label><input id="sOrg" maxlength="120" value="${esc(c.billing?.name || '')}"></div>
      <div class="field"><label for="sBill">Billing email</label><input id="sBill" type="email" maxlength="120" value="${esc(c.billing?.email || '')}"></div>
      <div><button class="btn primary" type="button" id="sGo">Save</button></div>
      <p class="muted" style="margin:0;font-size:13px;line-height:1.45;">Need a second director, or to hand the club to someone else? Email support@scoreframe.app.</p>
    </section>
    <section class="card pad" style="max-width:640px;display:flex;flex-direction:column;gap:12px;">
      <h2 style="font-size:20px;font-weight:800;">Privacy and terms</h2>
      <div class="row"><div style="flex:1 1 260px;"><div style="font-weight:700;">Who can see your teams</div><div class="muted" style="font-size:14px;">${c.privacyConfirmedAt ? esc(PRIVACY[c.privacy || 'signed_in'].short) : 'Not chosen yet'}</div></div><button class="btn ghost" type="button" id="pvOpen">${c.privacyConfirmedAt ? 'Change' : 'Choose'}</button></div>
      <div class="row"><div style="flex:1 1 260px;"><div style="font-weight:700;">Club Terms</div><div class="muted" style="font-size:14px;">${c.terms && c.terms.acceptedAt ? `Accepted ${new Date(c.terms.acceptedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} by ${esc(c.terms.acceptedByName || c.terms.acceptedByEmail || 'a director')}` : 'Not accepted yet'}</div></div><a class="btn ghost" href="/club-terms.html" target="_blank" rel="noopener">Read</a>${c.terms && c.terms.acceptedAt ? '' : '<button class="btn primary" type="button" id="tmOpen">Accept</button>'}</div>
    </section>
    ${ytSection()}
    <section class="card pad" style="max-width:640px;display:flex;flex-direction:column;gap:14px;">
      <h2 style="font-size:20px;font-weight:800;">Club look</h2>
      <p class="muted" style="margin:0;line-height:1.5;">Every team starts with the club logo and colors. When you change them here, the teams still using the club look change too. A team whose coach or you picked its own keeps it.</p>
      <div class="logobox">
        ${crest(c.logoUrl, c.name, c.color, 72, 16, 'crest', 'font-size:24px;')}
        <div class="row" style="gap:8px;">
          <button class="btn ghost" type="button" id="lgPick">${c.logoUrl ? 'Change logo' : 'Upload logo'}</button>
          ${c.logoUrl ? '<button class="btn link" type="button" id="lgDel">Remove</button>' : ''}
        </div>
        <input id="lgFile" type="file" accept="image/png,image/jpeg,image/webp" class="hide" aria-label="Club logo file">
      </div>
      <p class="muted" style="margin:0;font-size:13px;">Square works best, at least 256 pixels. A transparent background looks right on every team color.</p>
      <div class="grid2">
        <div class="field"><label for="sColor">Main color</label><input id="sColor" type="color" value="${esc(c.color || '#C8102E')}" style="height:44px;padding:4px;"></div>
        <div class="field"><label for="sColor2">Second color</label><input id="sColor2" type="color" value="${esc(c.color2 || '#FFFFFF')}" style="height:44px;padding:4px;"></div>
      </div>
      <div class="row" style="gap:10px;"><button class="btn primary" type="button" id="lkSave">Save colors</button>
        <button class="btn ghost" type="button" id="lkAll">Use the club look on every team…</button></div>
    </section>`;
  $('pvOpen').onclick = () => privacyDialog();
  if ($('tmOpen')) $('tmOpen').onclick = () => termsDialog();
  wireYouTube();
  $('lgPick').onclick = () => $('lgFile').click();
  $('lgFile').onchange = () => busy($('lgPick'), async () => {
    const img = await logoDataUrl($('lgFile').files[0]); if (!img) return;
    const r = await call('clubSetLogo', { clubId: S.clubId, image: img });
    toast(`Logo saved${r.teamsUpdated ? `; ${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'} updated` : ''}.`); await loadClubs(); renderWho();
  });
  if ($('lgDel')) $('lgDel').onclick = (ev) => busy(ev.currentTarget, async () => {
    if (!confirm('Remove the club logo? Teams using it go back to no logo; teams with their own keep theirs.')) return;
    const r = await call('clubSetLogo', { clubId: S.clubId, image: null });
    toast(`Logo removed${r.teamsUpdated ? ` from ${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'}` : ''}.`); await loadClubs(); renderWho();
  });
  $('lkSave').onclick = (ev) => busy(ev.currentTarget, async () => {
    const r = await call('clubUpdate', { clubId: S.clubId, color: $('sColor').value, color2: $('sColor2').value });
    toast(`Colors saved${r.teamsUpdated ? `; ${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'} updated` : ''}.`);
  });
  $('lkAll').onclick = (ev) => busy(ev.currentTarget, async () => {
    if (!confirm('Put the club logo and colors on every team, including teams that picked their own?')) return;
    const r = await call('clubApplyLook', { clubId: S.clubId, logo: true, colors: true });
    await loadTeams(); toast(r.teamsUpdated ? `${r.teamsUpdated} team${r.teamsUpdated === 1 ? '' : 's'} updated.` : 'Every team already uses the club look.');
  });
  $('sGo').onclick = (ev) => busy(ev.currentTarget, async () => {
    await call('clubUpdate', { clubId: S.clubId, name: $('sName').value, city: $('sCity').value, orgName: $('sOrg').value, billingEmail: $('sBill').value });
    toast('Saved.'); await loadClubs(); renderWho();
  });
}
</script>
</body>
</html>
