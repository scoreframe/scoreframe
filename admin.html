<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ScoreFrame Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Admin console (2026-10-29): the club console's look, a desk page. Canvas:
   claude.ai artifact "ScoreFrame Admin console". Data comes only from the
   admin* callables in functions/admin_console.js. */
:root { color-scheme: light;
  --paper: #F5F5F2; --card: #FFFFFF; --ink: #1C1B1F; --mu: #5A565F; --ln: #E2DFDA; --ln2: #EFECE7; --in: #D5D1CB;
  --deep: #111215; --deep2: #1F2026; --deep-tx: #F1EEE9; --deep-mu: #A9ADB6;
  --orange: #FF9640; --on-orange: #1A1004; --link: #A64F0A; --link-h: #7A3906; --sel: #FFF4EA;
  --ok-bg: #E3F5EA; --ok: #146B3D; --warn-bg: #FFF1DC; --warn: #8A4B00; --bad-bg: #FFE3E3; --bad: #B3121D; --info-bg: #EEF0F4; --info: #3B4150; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: Archivo, -apple-system, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; }
a { color: var(--link); } a:hover { color: var(--link-h); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -.5px; text-wrap: balance; }
h2 { margin: 0; font-size: 19px; font-weight: 800; }
.lbl { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--mu); }
.sub { color: var(--mu); font-size: 13px; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--ln); border-radius: 14px; }
.pad { padding: 18px 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; border: 1px solid var(--in); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: #FBFAF8; color: var(--ink); }
.btn.pri { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
.btn.danger { border-color: #E7B4B4; color: var(--bad); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.bad { background: var(--bad-bg); color: var(--bad); } .warn { background: var(--warn-bg); color: var(--warn); } .ok { background: var(--ok-bg); color: var(--ok); } .info { background: var(--info-bg); color: var(--info); }
.in { font: inherit; font-size: 15px; padding: 9px 11px; border: 1px solid var(--in); border-radius: 9px; background: #fff; color: var(--ink); min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--mu); font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--mu); padding: 9px 10px; border-bottom: 1px solid var(--ln); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--ln2); vertical-align: top; }
tr.go { cursor: pointer; } tr.go:hover td { background: #FBFAF8; }
.scroll { overflow-x: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.tile .v { font-size: 27px; font-weight: 900; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cols { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.main-col { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.side-col { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--ln2); font-size: 14px; }
.li:first-of-type { border-top: 0; }
.empty { color: var(--mu); font-size: 14px; padding: 8px 0; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.note { background: var(--warn-bg); color: #5C3300; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.crest { width: 34px; height: 34px; border-radius: 9px; color: #fff; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
.crest img { width: 100%; height: 100%; object-fit: cover; }
.bar { height: 6px; border-radius: 3px; background: var(--ln2); overflow: hidden; width: 90px; } .bar span { display: block; height: 100%; background: var(--orange); }
.f-chip { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--in); background: #fff; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; }
.f-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
/* Shell */
.shell { display: flex; flex-wrap: wrap; min-height: 100vh; }
.rail { flex: 1 1 232px; max-width: 232px; min-width: 200px; background: var(--deep); color: var(--deep-tx); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; }
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; text-decoration: none; color: var(--deep-tx); }
.rail .brand img { width: 32px; height: 32px; border-radius: 8px; }
.rail nav { display: flex; flex-direction: column; gap: 4px; }
.rail nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #C9CCD3; text-decoration: none; font-size: 15px; font-weight: 600; }
.rail nav a:hover { background: var(--deep2); color: var(--deep-tx); }
.rail nav a[aria-current="page"] { background: #2A2117; color: #FFB877; }
.rail nav a .ct { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--orange); color: var(--on-orange); border-radius: 999px; padding: 1px 8px; }
.rail .foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px 6px 0; border-top: 1px solid #26272D; font-size: 13px; color: var(--deep-mu); line-height: 1.4; }
.rail .foot button { all: unset; cursor: pointer; color: #FFB877; font-size: 14px; }
.mode { align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: #3A2A10; color: #FFC97A; }
.mode.live { background: #12351F; color: #8FE0AE; }
main { flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; }
.head .t { display: flex; flex-direction: column; gap: 4px; }
/* Gate */
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.gate .card { width: min(440px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.codebox { font: 600 26px 'IBM Plex Mono', monospace; letter-spacing: 6px; text-align: center; padding: 12px; }
.backup { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font: 15px 'IBM Plex Mono', monospace; background: var(--paper); border-radius: 10px; padding: 14px; }
/* Dialog, toast */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(17,18,21,.45); }
dialog form { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.hide { display: none !important; }
.msg { border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.55; background: var(--paper); white-space: pre-wrap; word-break: break-word; }
.msg.us { background: var(--sel); align-self: flex-end; max-width: 88%; }
@media (max-width: 760px) { main { padding: 20px 16px; } .rail { max-width: none; flex-basis: 100%; } .rail nav { flex-direction: row; flex-wrap: wrap; } .rail .foot { margin-top: 8px; } }
</style>
</head>
<body>
<div id="root"><div class="gate"><div class="card"><span class="sub">Loading…</span></div></div></div>
<dialog id="dlg"></dialog>
<div class="toast hide" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const app = initializeApp({
  apiKey: "AIzaSyBhqtlHshe3wEEPkJe7mVUIrZ1IJirullU", authDomain: "scoreframe-deploy.firebaseapp.com",
  databaseURL: "https://scoreframe-deploy-default-rtdb.firebaseio.com", projectId: "scoreframe-deploy",
  storageBucket: "scoreframe-deploy.firebasestorage.app", messagingSenderId: "728886280072",
  appId: "1:728886280072:android:0050478669b89fc76b043d"
});
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(() => {});
const fns = getFunctions(app);
const google = new GoogleAuthProvider(); google.setCustomParameters({ prompt: 'select_account' });
const ADMINS = ['support@scoreframe.app', 'eric@bloomcamp.com'];

// ── Small helpers ──────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (c, cur = 'usd') => new Intl.NumberFormat('en-US', { style: 'currency', currency: String(cur || 'usd').toUpperCase(), maximumFractionDigits: (c || 0) % 100 ? 2 : 0 }).format((c || 0) / 100);
const day = (ms) => ms ? new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const dayShort = (ms) => ms ? new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
const when = (ms) => ms ? new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
const ymdDay = (ymd) => { if (!ymd) return '—'; const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); };
const ymdOf = (ms) => new Date(ms).toISOString().slice(0, 10);
function ago(ms) {
  if (!ms) return '—';
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  if (s < 86400 * 14) return `${Math.round(s / 86400)} days ago`; return dayShort(ms);
}
const chip = (t, k = 'info') => `<span class="chip ${k}">${esc(t)}</span>`;
const initials = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
function crest(c, px = 34) {
  return `<span class="crest" style="width:${px}px;height:${px}px;background:${esc(c.color || '#555')}">${c.logoUrl && /^https:\/\//.test(c.logoUrl) ? `<img src="${esc(c.logoUrl)}" alt="">` : esc(initials(c.name))}</span>`;
}
function toast(m, ms = 3500) { const t = $('toast'); t.textContent = m; t.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hide'), ms); }
const errText = (e) => String((e && e.message) || e || 'Something went wrong').replace(/^.*?:\s*(?=[A-Z])/, '');

let ME = null;   // adminMe
async function call(name, data = {}) {
  try { return (await httpsCallable(fns, name)(data)).data; }
  catch (e) {
    if (e && e.code === 'functions/unauthenticated' && /MFA_REQUIRED/.test(e.message || '')) { codeGate(); throw new Error('Enter your Google Authenticator code to continue.'); }
    throw e;
  }
}
/** A dialog with fields; resolves to the values, or null on cancel. Every change needs a reason. */
function ask({ title, body = '', fields = [], reason = true, code = false, ok = 'Save', danger = false }) {
  return new Promise((resolve) => {
    const d = $('dlg');
    d.returnValue = '';
    d.innerHTML = `<form method="dialog">
      <h2>${esc(title)}</h2>${body ? `<div style="font-size:14px;line-height:1.5;color:var(--ink)">${body}</div>` : ''}
      ${fields.map((f, i) => f.type === 'check'
        ? `<label style="display:flex;gap:8px;align-items:center;font-size:15px"><input type="checkbox" id="af${i}" ${f.value ? 'checked' : ''}> ${esc(f.label)}</label>`
        : f.type === 'select' ? `<label class="f">${esc(f.label)}<select class="in" id="af${i}">${f.options.map((o) => `<option value="${esc(o[0])}" ${o[0] === f.value ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`
        : f.type === 'area' ? `<label class="f">${esc(f.label)}<textarea class="in" id="af${i}" rows="4">${esc(f.value || '')}</textarea></label>`
        : `<label class="f">${esc(f.label)}<input class="in" id="af${i}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.step ? `step="${f.step}"` : ''}></label>`).join('')}
      ${reason ? `<label class="f">Reason (goes in the audit log)<input class="in" id="aReason" placeholder="Why, in a few words"></label>` : ''}
      ${code ? `<label class="f">Google Authenticator code<input class="in mono" id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>` : ''}
      <div class="err hide" id="aErr"></div>
      <div class="row"><button class="btn ${danger ? 'danger' : 'pri'}" value="ok" id="aOk">${esc(ok)}</button><button class="btn" value="cancel" formnovalidate>Cancel</button></div>
    </form>`;
    d.showModal();
    d.onclose = () => { if (d.returnValue !== 'ok') resolve(null); };
    $('aOk').onclick = (ev) => {
      ev.preventDefault();
      const vals = fields.map((f, i) => f.type === 'check' ? $(`af${i}`).checked : $(`af${i}`).value.trim());
      const r = reason ? $('aReason').value.trim() : '';
      if (reason && !r) { $('aErr').textContent = 'Add a reason.'; $('aErr').classList.remove('hide'); return; }
      const out = { vals, reason: r, code: code ? $('aCode').value.trim() : '' };
      d.returnValue = 'ok'; d.close(); resolve(out);
    };
  });
}
async function act(name, data, done) {
  try { const r = await call(name, data); if (done) done(r); else toast('Saved.'); route(); return r; }
  catch (e) { toast(errText(e), 7000); }
}

// ── Sign-in and the authenticator gate ─────────────────────────────────
const root = $('root');
function gate(html) { root.innerHTML = `<div class="gate"><div class="card">${html}</div></div>`; }
function signInGate(msg = '') {
  gate(`<div class="row" style="gap:10px"><img src="/apple-touch-icon.png" alt="" width="40" height="40" style="border-radius:10px"><h2 style="font-size:22px">ScoreFrame Admin</h2></div>
    <p style="margin:0;line-height:1.5">For ScoreFrame staff only. Sign in with Google as support@scoreframe.app or eric@bloomcamp.com.</p>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}<button class="btn pri" id="gIn">Sign in with Google</button>`);
  $('gIn').onclick = async () => { try { await signInWithPopup(auth, google); } catch (e) { if (e.code === 'auth/popup-blocked') signInWithRedirect(auth, google); else signInGate(errText(e)); } };
}
async function enrollGate() {
  let r;
  try { r = await call('adminMfaStart'); } catch (e) { return gate(`<h2>Set up Google Authenticator</h2><div class="err">${esc(errText(e))}</div><button class="btn" id="gOut">Sign out</button>`), $('gOut').onclick = () => signOut(auth); }
  gate(`<h2>Set up Google Authenticator</h2>
    <p style="margin:0;line-height:1.5">One time. In Google Authenticator tap <strong>+</strong>, then <strong>Scan a QR code</strong>. From now on the admin console asks for the 6-digit code every 12 hours.</p>
    <div id="qr" style="align-self:center;padding:10px;background:#fff;border:1px solid var(--ln);border-radius:12px"></div>
    <details><summary class="sub" style="cursor:pointer">Can't scan? Type this key instead</summary><p class="mono" style="word-break:break-all;margin:8px 0 0">${esc(r.secret.replace(/(.{4})/g, '$1 ').trim())}</p></details>
    <label class="f">The 6-digit code it shows<input class="in codebox" id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
    <div class="err hide" id="gErr"></div><button class="btn pri" id="gGo">Turn it on</button>`);
  try { new QRCode($('qr'), { text: r.otpauth, width: 184, height: 184 }); } catch (_) { $('qr').textContent = 'QR code unavailable: type the key below.'; }
  $('gCode').focus();
  $('gGo').onclick = () => verify($('gCode').value, true);
}
function codeGate() {
  gate(`<h2>Enter your code</h2>
    <p style="margin:0;line-height:1.5">Open Google Authenticator and enter the 6-digit code for <strong>ScoreFrame Admin</strong>. Lost your phone? Enter one of your backup codes.</p>
    <label class="f">Code<input class="in codebox" id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="11"></label>
    <div class="err hide" id="gErr"></div><button class="btn pri" id="gGo">Unlock for 12 hours</button>
    <button class="btn" id="gOut">Sign out</button>`);
  $('gCode').focus();
  $('gCode').onkeydown = (e) => { if (e.key === 'Enter') verify($('gCode').value, false); };
  $('gGo').onclick = () => verify($('gCode').value, false);
  $('gOut').onclick = () => signOut(auth);
}
async function verify(code, enrolling) {
  const btn = $('gGo'); btn.disabled = true;
  try {
    const r = await httpsCallable(fns, 'adminMfaVerify')({ code: String(code || '').trim() }).then((x) => x.data);
    await auth.currentUser.getIdToken(true);
    ME = await call('adminMe');
    if (r.backupCodes) {
      gate(`<h2>Save your backup codes</h2><p style="margin:0;line-height:1.5">Each works once if your phone is lost. Keep them somewhere safe, like a password manager. They won't be shown again.</p>
        <div class="backup">${r.backupCodes.map((c) => `<span>${esc(c)}</span>`).join('')}</div>
        <button class="btn" id="gCopy">Copy them</button><button class="btn pri" id="gDone">I've saved them</button>`);
      $('gCopy').onclick = () => navigator.clipboard.writeText(r.backupCodes.join('\n')).then(() => toast('Copied.'));
      $('gDone').onclick = () => shell();
      return;
    }
    if (r.usedBackup) toast(`Backup code used. ${r.backupLeft} left.`, 6000);
    shell();
  } catch (e) {
    btn.disabled = false;
    const box = $('gErr'); box.textContent = errText(e); box.classList.remove('hide');
  }
}
onAuthStateChanged(auth, async (u) => {
  if (!u) return signInGate();
  const tok = await u.getIdTokenResult().catch(() => null);
  if (!ADMINS.includes(String(u.email || '').toLowerCase()) || !tok || tok.signInProvider !== 'google.com') {
    gate(`<h2>Not an admin account</h2><p style="margin:0;line-height:1.5">You're signed in as <strong>${esc(u.email || 'an account with no email')}</strong>${tok && tok.signInProvider !== 'google.com' ? ' with a password' : ''}. The admin console is for support@scoreframe.app and eric@bloomcamp.com, signed in with Google.</p><button class="btn" id="gOut">Sign out</button>`);
    $('gOut').onclick = () => signOut(auth);
    return;
  }
  try { ME = await call('adminMe'); } catch (e) { return signInGate(errText(e)); }
  if (!ME.enrolled) return enrollGate();
  if (!(ME.mfaUntil > Date.now()) || !(Number(tok.claims.adminMfaUntil) > Date.now())) return codeGate();
  shell();
});

// ── Shell and routing ──────────────────────────────────────────────────
const ICON = {
  today: '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>',
  clubs: '<path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"></path>',
  billing: '<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18M7 15h4"></path>',
  people: '<circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .7 3.2 2.5 3.6 5.2"></path>',

function wireCleanup() {

  if (onB) onB.onclick = async () => {
    const a = await ask({ title: 'Turn on account cleanup', ok: 'Turn on', danger: true, code: true,
      body: 'Empty accounts start getting the warning email tonight, and the ones nobody answers are closed when their time is up. Closed accounts can\'t be restored, but the person can sign up again.' });
    if (a) act('adminCleanup', { action: 'mode', mode: 'live', reason: a.reason, code: a.code }, () => toast('Account cleanup is on.'));
  };
  if (offB) offB.onclick = async () => {
    const a = await ask({ title: 'Back to report only', ok: 'Switch', body: 'No more warnings or closures. People already warned keep their accounts.' });

}

WIRE.accounts = () => {
  wireCleanup();
  const f = $('accF');
  if (f) f.onchange = () => document.querySelectorAll('tr[data-kind]').forEach((tr) => { tr.style.display = f.value === 'all' || tr.dataset.kind === f.value ? '' : 'none'; });
  document.querySelectorAll('[data-keep]').forEach((b) => b.onclick = async () => {
    const a = await ask({ title: 'Keep this account', ok: 'Keep', body: `${esc(b.dataset.keep)} won't be warned or closed by the cleanup.` });
    if (a) act('adminCleanup', { action: 'keep', email: b.dataset.keep, reason: a.reason }, () => toast('Kept.'));
  });
  document.querySelectorAll('[data-unkeep]').forEach((b) => b.onclick = () => act('adminCleanup', { action: 'unkeep', email: b.dataset.unkeep, reason: '' }, () => toast('Removed from the keep list.')));
};
VIEWS.system = async () => {
  const r = state.system = await call('adminSystem');
  const errTotal = r.errors.reduce((a, b) => a + b.count, 0);
  return `${head('Servers, apps, admins', 'System and audit')}
    <section class="grid">
      <div class="card tile"><span class="lbl">Server errors, 24 h</span><span class="v">${errTotal}</span><span class="sub">${r.errors.filter((e) => e.count).length} functions</span></div>
      <div class="card tile"><span class="lbl">Live right now</span><span class="v">${r.liveNow.length}</span><span class="sub">${r.stuck.length} stuck</span></div>
      <div class="card tile"><span class="lbl">Accounts</span><span class="v">${r.users}</span><span class="sub">${r.bots30} bot-like in 30 days</span></div>
      <div class="card tile"><span class="lbl">YouTube quota</span><span class="v">${(r.youtubeQuota.grant / 1000).toFixed(0)}k</span><span class="sub">a day · grant ends ${ymdDay(r.youtubeQuota.grantEnds)}</span></div>
      <div class="card tile"><span class="lbl">Test leftovers</span><span class="v">${r.zz}</span><span class="sub">teams named ZZ…</span></div></section>
    <div class="cols"><section class="main-col"><div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>Server errors, last 24 hours</h2>
        <div class="scroll"><table><thead><tr><th>Function</th><th>Errors</th><th>Last one</th></tr></thead><tbody>
        ${r.errors.length ? r.errors.map((e) => `<tr><td class="mono">${esc(e.fn)}</td><td>${e.count ? chip(String(e.count), 'warn') : ''}</td><td class="sub">${esc(e.last)}${e.lastAt ? ` · ${ago(e.lastAt)}` : ''}</td></tr>`).join('') : '<tr><td colspan="3" class="empty">No errors.</td></tr>'}</tbody></table></div></div>
      <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>Live and stuck</h2>
        ${[...r.stuck.map((s) => ({ ...s, stuck: true })), ...r.liveNow].map((s) => `<div class="li"><span><a href="#people/t/${esc(s.teamId)}"><strong>${esc(s.name)}</strong></a><br><span class="sub">${s.stuck ? 'stuck: no update since ' : 'live since '}${when(s.updatedAt)}</span></span>${s.stuck ? chip('Stuck', 'bad') : chip('Live', 'ok')}</div>`).join('') || '<div class="empty">Nothing live.</div>'}</div>
      <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>Audit log</h2><span class="sub">Every admin change with its reason, newest first.</span>
        <div class="scroll"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Reason</th></tr></thead><tbody>
        ${r.audit.length ? r.audit.map((x) => `<tr><td class="sub" style="white-space:nowrap">${when(x.at)}</td><td>${esc(String(x.by || '').split('@')[0])}@</td><td>${esc(describeAudit(x))}</td><td class="sub">${esc(x.reason || '')}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">Nothing yet.</td></tr>'}</tbody></table></div></div></section>
    <aside class="side-col">${cleanupCard(r.cleanup)}<section class="card pad"><h2>Apps in use</h2><p class="sub" style="margin:6px 0 4px">Versions synced in the last 30 days.</p>
        ${r.versions.map(([k, n]) => `<div class="li"><span>${esc(k)}</span><strong>${n}</strong></div>`).join('') || '<div class="empty">No data.</div>'}</section>
      <section class="card pad"><h2>Who can open this page</h2>
        ${r.admins.map((a) => `<div class="li"><span>${esc(a.email)}<br><span class="sub">signed in ${ago(a.lastSignIn)}</span></span>${a.mfa ? chip(`Authenticator · ${a.backupLeft} backups`, 'ok') : chip('No authenticator yet', 'warn')}</div>`).join('')}
        <p class="sub" style="margin:10px 0 0;line-height:1.5">Only these two Google sign-ins, plus a Google Authenticator code every 12 hours. The server checks both on every action, not just this page.</p></section>
      <section class="card pad"><h2>App-wide announcements</h2><p class="sub" style="margin:6px 0 4px">Sending to every user is turned off.</p>
        ${r.broadcasts.map((b) => `<div class="li"><span>${esc(b.title)}</span><span class="sub">${day(b.createdAt)}</span></div>`).join('') || '<div class="empty">None.</div>'}</section></aside></div>`;
};
</script>
</body>
</html>
