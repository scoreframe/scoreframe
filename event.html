<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- NOT INDEXABLE (2026-08-16).
     These pages carry roster names, jersey numbers, schedules and venues for
     teams that are often children. A search engine turning that into a
     findable profile — name + number + team + where they'll be on Saturday —
     is a bigger exposure than any in-app viewer, and it's the one an outsider
     actually stumbles across.

     Deliberately NOT blocked in robots.txt: a disallowed page can't be
     fetched, so the crawler never SEES this tag and Google may still index the
     bare URL from inbound links. Allow the crawl, refuse the index. -->
<meta name="robots" content="noindex, nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<title>ScoreFrame — Event</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg-deepest: #0D0D0D; --bg-deep: #141414; --bg-surface: #1E1E1E;
    --bg-elevated: #272727; --accent: #FF9640; --accent-dim: rgba(255,150,64,0.15);
    --text-primary: #E0E0E0; --text-secondary: #999; --text-muted: #666;
    --success: #4CAF50; --error: #F44336; --recording-red: #CC2222;
    --win-green: #2E7D32; --loss-red: #C62828; --tie-grey: #777777;
}
/* In-app theme override — GamePageActivity/GamePageView appends ?theme=light|dark. */
body[data-theme="dark"] {
    --bg-deepest: #0D0D0D !important; --bg-deep: #141414 !important; --bg-surface: #1E1E1E !important;
    --bg-elevated: #272727 !important; --accent: #FF9640 !important; --accent-dim: rgba(255,150,64,0.15) !important;
    --text-primary: #E0E0E0 !important; --text-secondary: #999 !important; --text-muted: #666 !important;
    --win-green: #2E7D32 !important; --loss-red: #C62828 !important; --tie-grey: #777777 !important;
}
body[data-theme="light"] {
    --bg-deepest: #F5F5F2 !important; --bg-deep: #FFFFFF !important; --bg-surface: #FFFFFF !important;
    --bg-elevated: #ECECE8 !important; --accent: #E47A1F !important; --accent-dim: rgba(228,122,31,0.15) !important;
    --text-primary: #1A1A1A !important; --text-secondary: #555 !important; --text-muted: #888 !important;
    --win-green: #1B5E20 !important; --loss-red: #B71C1C !important; --tie-grey: #888888 !important;
}

/* ── In-app colour palette (?palette=) — added 2026-08-01 ─────────────
   The APP appends ?palette=<name> when it opens this page in its WebView so
   the page matches whichever palette the user picked in Settings. It is a
   personal preference, NOT branding: share/copy links deliberately omit it,
   so anyone opening a shared link gets ScoreFrame orange.

   Deliberately a SEPARATE param from ?theme= — that one already means
   light|dark here and has since v14. Overloading it would have broken every
   existing in-app link.

   Unknown or absent value = no selector matches = brand orange. That is the
   whole backwards-compatibility story; nothing else needs a fallback.

   Two-attribute selectors beat the one-attribute body[data-theme] blocks
   above on specificity, so the light variants below win where both apply. */
body[data-palette="trailhead"] {
    --accent: #8E9A45 !important; --accent-dim: rgba(142,154,69,0.15) !important;
}
body[data-theme="light"][data-palette="trailhead"] {
    --accent: #4E5A21 !important; --accent-dim: rgba(78,90,33,0.15) !important;
}
body[data-palette="floodlight"] {
    --accent: #4E9CE8 !important; --accent-dim: rgba(78,156,232,0.15) !important;
}
body[data-theme="light"][data-palette="floodlight"] {
    --accent: #1C5FA8 !important; --accent-dim: rgba(28,95,168,0.15) !important;
}
@media (prefers-color-scheme: light) {
    :root {
        --bg-deepest: #F5F5F2; --bg-deep: #FFFFFF; --bg-surface: #FFFFFF;
        --bg-elevated: #ECECE8; --accent: #E47A1F; --accent-dim: rgba(228,122,31,0.15);
        --text-primary: #1A1A1A; --text-secondary: #555; --text-muted: #888;
        --win-green: #1B5E20; --loss-red: #B71C1C; --tie-grey: #888888;
    }
}
body.app .top-bar { display: none; }
html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-deepest); color: var(--text-primary);
    min-height: 100vh; overflow-x: hidden;
}

.top-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--bg-deep);
    border-bottom: 1px solid var(--bg-elevated);
}
.brand { text-decoration: none; font-size: 1.1rem; font-weight: 800; color: var(--text-primary); }
.brand .accent { color: var(--accent); }
.back-link {
    margin-left: auto; font-size: 13px; color: var(--text-secondary);
    text-decoration: none; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--bg-elevated);
}
.back-link:hover { color: var(--accent); border-color: var(--accent); }

.hero {
    padding: 24px; text-align: center;
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deepest) 100%);
    border-bottom: 1px solid var(--bg-elevated);
}
.team-color-bar { height: 4px; border-radius: 2px; margin-bottom: 14px; max-width: 480px; margin-left: auto; margin-right: auto; }
.event-type-badge {
    display: inline-block; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; padding: 4px 10px; border-radius: 4px;
    margin-bottom: 12px; color: var(--accent); background: var(--accent-dim);
}
.hero-team { font-size: 13px; color: var(--text-secondary); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.hero-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.hero-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
.live-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--recording-red); color: white; padding: 3px 10px;
    border-radius: 10px; font-size: 11px; font-weight: 700;
    animation: pulse 1s ease-in-out infinite; margin-top: 10px;
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

.section { padding: 20px 24px; }
.section-title {
    font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 12px;
}
.section-sub {
    font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
}
.empty {
    padding: 20px; text-align: center;
    color: var(--text-muted); font-size: 14px; font-style: italic;
    background: var(--bg-surface); border-radius: 12px;
    border: 1px dashed var(--bg-elevated);
}

.game-card {
    background: var(--bg-surface); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--bg-elevated);
    display: block; text-decoration: none; color: inherit;
}
.game-card:hover { border-color: var(--accent); }
.game-card.live { border-color: var(--recording-red); }
.game-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.game-left { flex: 1; min-width: 0; }
.game-status {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; margin-bottom: 6px;
}
.game-status.live { background: var(--recording-red); color: white; }
.game-status.scheduled { background: var(--accent-dim); color: var(--accent); }
.game-status.completed { background: rgba(76,175,80,0.15); color: var(--success); }
.game-status.cancelled { background: var(--bg-elevated); color: var(--text-muted); }
.game-opponent { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.game-meta { font-size: 12px; color: var(--text-muted); }
.game-score {
    font-size: 22px; font-weight: 800; color: var(--accent);
    margin-left: 12px; white-space: nowrap;
}
.game-chevron {
    color: var(--text-muted); font-size: 18px; margin-left: 6px;
}

/* ── DESKTOP LAYOUT (Eric, 2026-08-17) ────────────────────────────────────
   These pages were built mobile-first with no width ceiling, so on a laptop
   every row stretched the full window — a team name on the far left and its
   buttons on the far right, with a metre of nothing between. Mobile is
   untouched; above 900px the content becomes a centred column of readable
   width, which is what "bring the buttons in from the left and right" means.
   A ceiling rather than a redesign: the same markup, just stopped from
   spreading. */
@media (min-width: 900px) {
  body > .top-bar, body > .hero, body > .section, body > div[id] {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }
}

/* ── Tournament v2 (docs/TOURNAMENT_SPEC.md, 2026-09-28) ── */
.v2-wrap { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin: 0 auto; }
.v2-card { background: var(--bg-surface); border: 1px solid var(--bg-elevated); border-radius: 14px; padding: 12px 14px; }
.v2-live { border-color: var(--recording-red); display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.v2-play { width: 52px; height: 52px; border-radius: 26px; background: var(--accent); color: #1A1208; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.v2-lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; }
.v2-big { font-size: 20px; font-weight: 800; }
.v2-tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.v2-tile { background: var(--bg-surface); border: 1px solid var(--bg-elevated); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.v2-tile .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.v2-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bg-elevated); text-decoration: none; color: inherit; }
.v2-row:last-child { border-bottom: none; }
.v2-bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--bg-elevated); }
.v2-sub { font-size: 12.5px; color: var(--text-secondary); }
.v2-res { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.v2-win { color: #FFC800; } .v2-loss { color: var(--loss-red); }
.v2-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.v2-tab { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--bg-elevated); background: var(--bg-surface); color: var(--text-primary); font: inherit; font-size: 13px; cursor: pointer; }
.v2-tab.on { background: var(--accent); color: #1A1208; border-color: var(--accent); font-weight: 700; }
.v2-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.v2-table td, .v2-table th { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--bg-elevated); }
.v2-table th { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }
.v2-table .r { text-align: right; }
.v2-table tr.us td { color: var(--accent); font-weight: 700; }
.v2-slot { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--bg-elevated); font-size: 13px; margin: 4px 0; }
.v2-slot.us { outline: 1.5px solid var(--accent); color: var(--accent); font-weight: 700; }
/* Drawn bracket (2026-10-02): cards by round, elbow connectors. */
.br-scroll { overflow-x: auto; margin: 6px -4px 0; padding: 0 4px 6px; }
.br { position: relative; }
.br svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.br svg path { fill: none; stroke: var(--text-muted); stroke-width: 2; }
.br svg path.hot { stroke: #FFC800; }
.br-rt { position: absolute; top: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: var(--text-secondary); }
.br-m { position: absolute; width: 196px; background: var(--bg-elevated); border: 1px solid var(--text-muted); border-radius: 9px; overflow: hidden; }
.br-m.us { border-color: var(--accent); }
.br-m.bye { border-style: dashed; opacity: .8; }
.br-h { display: flex; justify-content: space-between; gap: 6px; padding: 4px 8px; font-size: 11px; color: var(--text-secondary); }
.br-h b { color: var(--text-primary); font-size: 12px; }
.br-t { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 13px; border-top: 1px solid rgba(128,128,128,.25); }
.br-seed { font-size: 10px; min-width: 18px; text-align: center; border: 1px solid var(--text-muted); border-radius: 4px; color: var(--text-secondary); }
.br-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.br-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; color: var(--text-primary); }
.br-n.ph { font-weight: 400; font-style: italic; color: var(--text-secondary); }
.br-t.us .br-n { color: var(--accent); }
.br-t.won .br-n, .br-t.won .br-s { color: #FFC800; }
.br-s { font-weight: 700; color: var(--text-secondary); }
.v2-link { color: var(--accent); background: none; border: none; font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
.v2-score { display: grid; grid-template-columns: 1fr 56px 56px 56px; gap: 6px; align-items: center; margin-top: 8px; }
.v2-score input { width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--bg-elevated); background: var(--bg-deep); color: var(--text-primary); text-align: center; font: inherit; font-size: 16px; }
.v2-btn { height: 42px; border: none; border-radius: 10px; background: var(--accent); color: #1A1208; font: inherit; font-weight: 800; cursor: pointer; padding: 0 16px; }
</style>
<script>
/* Palette param — mirrors the theme block above. Applied to <html> before
   paint and to <body> once it exists, same two-step as ?theme=, so there is
   no flash of the wrong accent. 2026-08-01. */
(function() {
    try {
        var p = new URLSearchParams(location.search).get('palette');
        if (p === 'trailhead' || p === 'floodlight') {
            document.documentElement.setAttribute('data-palette', p);
            if (document.body) {
                document.body.setAttribute('data-palette', p);
            } else {
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.setAttribute('data-palette', p);
                });
            }
        }
    } catch (e) {}
})();
</script>
</head>
<body>

<div class="top-bar">
    <a href="/" class="brand">Score<span class="accent">Frame</span></a>
    <a id="backLink" href="/" class="back-link">← Back</a>
</div>

<div class="hero">
    <div id="teamColorBar" class="team-color-bar" style="display:none;"></div>
    <div class="event-type-badge">🏆 TOURNAMENT</div>
    <div id="heroTeam" class="hero-team">—</div>
    <div id="heroTitle" class="hero-title">Loading…</div>

</div>

    <div class="section-title">Games in this event</div>
    <div id="gamesList"></div>
</div>
<div id="v2" class="v2-wrap" style="display:none;"></div>

<script type="module">
// Theme override from URL param (matches game.html).
(function() {
    try {
        var t = new URLSearchParams(location.search).get('theme');
        if (t === 'light' || t === 'dark') document.body.setAttribute('data-theme', t);
    } catch (_) {}
    if (new URLSearchParams(location.search).get('app') === '1') document.body.classList.add('app');
})();

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, getFirestore, doc, getDoc, collection, getDocs, onSnapshot, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBhqtlHshe3wEEPkJe7mVUIrZ1IJirullU",
    authDomain: "scoreframe-deploy.firebaseapp.com",
    databaseURL: "https://scoreframe-deploy-default-rtdb.firebaseio.com",
    projectId: "scoreframe-deploy",
    storageBucket: "scoreframe-deploy.firebasestorage.app",
    messagingSenderId: "728886280072",
    appId: "1:728886280072:android:0050478669b89fc76b043d"
};
const app = initializeApp(firebaseConfig);
// 2026-08-26 — initializeFirestore, not getFirestore.
//
// Eric hit "Loading team..." for a full two minutes on iOS, then it appeared.
// That number is the tell: the Firestore SDK talks WebChannel (a streaming
// transport) by default, and inside a WKWebView / Android WebView that stream
// can stall silently until it times out and falls back. The page isn't broken
// and the query isn't slow — the first read is just sitting on a dead socket.
//
// autoDetect spots the stalled stream and switches to long-polling in seconds
// instead of minutes. Preferred over experimentalForceLongPolling because
// these pages are also opened in ordinary desktop browsers, where WebChannel
// works fine and is the more efficient transport.
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const auth = getAuth(app);

// 2026-06-19 — Mirror team.html's SSO + auth-state gating. event.html
// previously called loadEvent() directly with no auth session, so on
// security-rules-restricted reads (team doc / past games) every fetch
// failed → "Could not load team" + empty games list. Now we wait for
// the WebView SSO handoff (#auth=<idToken> from the native app) and the
// first onAuthStateChanged event before fetching anything.
async function tryAppAuthHandoff() {
    const hash = window.location.hash || '';
    const m = hash.match(/[#&]auth=([^&]+)/);
    if (!m) return false;
    const idToken = decodeURIComponent(m[1]);
    try {
        const cleanHash = hash.replace(/[#&]auth=[^&]+/, '').replace(/^#$/, '');
        history.replaceState(null, '', window.location.pathname + window.location.search + cleanHash);
    } catch (_) {}
    try {
        const resp = await fetch('https://us-central1-scoreframe-deploy.cloudfunctions.net/mintAuthToken', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + idToken }
        });
        if (!resp.ok) { console.warn('[event auth] mintAuthToken ' + resp.status); return false; }
        const data = await resp.json();
        if (!data.customToken) return false;
        await signInWithCustomToken(auth, data.customToken);
        console.log('[event auth] SSO handoff complete');
        return true;
    } catch (e) {
        console.warn('[event auth] SSO handoff failed:', e);
        return false;
    }
}

let authResolved = false;
let authResolveFn = null;
const authReady = new Promise((resolve) => {
    authResolveFn = resolve;
    setTimeout(() => {
        if (!authResolved) { authResolved = true; resolve(); }
    }, 2000);
});
onAuthStateChanged(auth, () => {
    if (!authResolved) {
        authResolved = true;
        authResolveFn && authResolveFn();
    }
});

const params = new URLSearchParams(location.search);
const hubCode = (params.get('team') || '').trim().toUpperCase();
const eventId = (params.get('event') || '').trim();

const $ = (id) => document.getElementById(id);
const SPORT_EMOJI = {
    Basketball: '🏀', Football: '🏈', Soccer: '⚽', Volleyball: '🏐',
    Baseball: '⚾', Softball: '🥎', Tennis: '🎾', Pickleball: '🏓',
    Hockey: '🏒', Lacrosse: '🥍', Bowling: '🎳', Generic: '🏆',
};

function formatDate(ms) {
    if (!ms || typeof ms !== 'number') return 'TBD';
    const d = new Date(ms);
    const opts = { weekday: 'short', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit' };
    return d.toLocaleString(undefined, opts);
}
// v15 — Multi-day tournament range. Falls back to single-date when end is
// missing or <= start.
function formatDateRange(startMs, endMs) {
    if (!endMs || endMs <= startMs) return formatDate(startMs);
    const s = new Date(startMs), e = new Date(endMs);
    const sStr = s.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const eStr = e.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return `${sStr} – ${eStr}`;
}

function statusLabel(g) {
    if (g.status === 'live') return '● LIVE';
    if (g.status === 'completed') return 'Final';
    if (g.status === 'cancelled') return 'Cancelled';
    return formatDate(g.date);
}

function gameHeadline(g) {
    if (g.opponent) return `vs ${g.opponent}`;
    if (g.eventName) return g.eventName;
    return 'Game';
}

async function loadEvent() {
    if (!hubCode || !eventId) {
        $('heroTitle').textContent = 'Missing event link';
        return;
    }
/** [ours, theirs] for THIS team. A game where the team is the AWAY side
 *  (awayTeamId) was read from the home side, so a loss counted as a win
 *  (CT Bulldogs at CST Wildcats, 2026-09-28). */
function ourTheir(g, tid) {
    const away = !!tid && g.awayTeamId === tid && g.homeTeamId !== tid;
    const h = g.homeScore || 0, a = g.awayScore || 0;
    return away ? [a, h] : [h, a];
}
    let teamId = null;
    let team = null;
    try {
        const idx = await getDoc(doc(db, 'hubIndex', hubCode));
        if (!idx.exists()) {
            $('heroTitle').textContent = 'Team not found';
            return;
        }
        teamId = idx.data().teamId;
        const teamSnap = await getDoc(doc(db, 'teams', teamId));
        team = teamSnap.exists() ? teamSnap.data() : null;
    } catch (e) {
        console.error('Team lookup failed', e);
        $('heroTitle').textContent = 'Could not load team';
        return;
    }

    // Back link routes to the parent team page.
    $('backLink').href = `/team.html?code=${encodeURIComponent(hubCode)}`;
    $('backLink').textContent = `← ${team?.profile?.name || team?.name || 'Team'}`;

    // Team color stripe.
    const color = team?.profile?.color || team?.color;
    if (color) {
        const bar = $('teamColorBar');
        bar.style.background = color;
        bar.style.display = 'block';
    }
    const sport = team?.profile?.sport || team?.sport || '';
    const teamName = team?.profile?.name || team?.name || 'Team';
    $('heroTeam').textContent = `${SPORT_EMOJI[sport] || '🏆'} ${teamName}`;

    // v2 tournaments live in teams/{t}/events/{id} (TOURNAMENT_SPEC). Old
    // ones (a games/ doc with gameIds) keep the page below unchanged.
    try {
        const ev2 = await getDoc(doc(db, 'teams', teamId, 'events', eventId));
        if (ev2.exists()) { startV2(teamId, team, ev2); return; }
    } catch (e) { console.warn('events lookup failed, legacy view', e); }

    // Load event doc.
    let ev = null;
    try {
        const evSnap = await getDoc(doc(db, 'teams', teamId, 'games', eventId));
        if (!evSnap.exists()) {
            $('heroTitle').textContent = 'Event not found';
            return;
        }
        ev = { id: evSnap.id, ...evSnap.data() };
    } catch (e) {
        console.error('Event lookup failed', e);
        $('heroTitle').textContent = 'Could not load event';
        return;
    }

    // Hero metadata.
    document.title = `${ev.eventName || 'Tournament'} — ScoreFrame`;
    $('heroTitle').textContent = ev.eventName || 'Tournament';
    // v15 — Render the date range for multi-day tournaments.
    $('heroDate').textContent = (typeof ev.endDate === 'number' && ev.endDate > (ev.date || 0))
        ? formatDateRange(ev.date, ev.endDate)
        : formatDate(ev.date);
    if (ev.location) {
        $('heroLocation').textContent = `📍 ${ev.location}`;
        $('heroLocation').style.display = '';
    }
    if (ev.notes) {
        $('heroNotes').textContent = ev.notes;
        $('heroNotes').style.display = '';
    }
    if (ev.seasonId) {
        try {
            const seasonsSnap = await getDocs(collection(db, 'teams', teamId, 'seasons'));
            const s = seasonsSnap.docs.find(d => d.id === ev.seasonId);
            if (s) {
                const sd = s.data();
                $('heroSeason').textContent = `Season: ${sd.name}${sd.endDate ? ' (ended)' : ''}`;
                $('heroSeason').style.display = '';
            }
        } catch (_) {}
    }

    // Child games — gameIds[] on the parent event doc.
    const ids = Array.isArray(ev.gameIds) ? ev.gameIds.filter(x => typeof x === 'string' && x.length > 0) : [];
    const list = $('gamesList');
    if (ids.length === 0) {
        list.innerHTML = '<div class="empty">No games played in this event yet. They\'ll appear here as the event runs.</div>';
        return;
    }
    // Fetch child docs in parallel. Skip any that have been deleted.
    const fetched = await Promise.all(ids.map(async (gid) => {
        try {
            const snap = await getDoc(doc(db, 'teams', teamId, 'games', gid));
            return snap.exists() ? { id: snap.id, ...snap.data() } : null;
        } catch (_) { return null; }
    }));
    const games = fetched.filter(g => g != null);
    if (games.length === 0) {
        list.innerHTML = '<div class="empty">No games available.</div>';
        return;
    }
    // v18 — Event record line in the hero: W/L (team sports) or a scoring
    // summary (bowling) across the completed child games in this event.
    const completed = games.filter(g => g.status === 'completed');
    if (completed.length > 0) {
        const evSport = (team?.profile?.sport || team?.sport || completed[0].sport || '').toUpperCase();
        if (evSport === 'BOWLING') {
            let totalScore = 0, totalGames = 0, high = 0;
            for (const g of completed) {
                const ps = g.playerScores || '';
                if (ps) {
                    for (const b of ps.split(';')) {
                        const scs = (b.split(':')[1] || '').split(',').map(Number).filter(n => n > 0);
                        totalScore += scs.reduce((a, c) => a + c, 0);
                        totalGames += scs.length;
                        high = Math.max(high, ...scs, 0);
                    }
                } else if (g.homeScore > 0) {
                    totalScore += g.homeScore; totalGames++; high = Math.max(high, g.homeScore);
                }
            }
            const avg = totalGames > 0 ? Math.round(totalScore / totalGames) : 0;
            $('heroRecord').textContent = `${totalGames} game${totalGames !== 1 ? 's' : ''} · Avg ${avg} · High ${high}`;
            $('heroRecord').style.display = '';
        } else {
            let w = 0, l = 0, t = 0;
            for (const g of completed) {
                if (g.countTowardStats === false) continue;
                const [hs, as_] = ourTheir(g, teamId);
                if (hs > as_) w++; else if (as_ > hs) l++; else if (hs > 0) t++;
            }
            const rec = `${w}W-${l}L` + (t > 0 ? `-${t}T` : '');
            const counted = completed.filter(g => g.countTowardStats !== false).length;
            $('heroRecord').textContent = `${rec} · ${counted} game${counted !== 1 ? 's' : ''}`;
            $('heroRecord').style.display = '';
        }
    }
    // Sort: live first, then scheduled by date asc, then completed by date desc.
    games.sort((a, b) => {
        const rank = (g) => g.status === 'live' ? 0 : g.status === 'scheduled' ? 1 : g.status === 'completed' ? 2 : 3;
        const ra = rank(a), rb = rank(b);
        if (ra !== rb) return ra - rb;
        const ad = a.date || 0, bd = b.date || 0;
        return rb === 2 ? bd - ad : ad - bd;
    });
    if (games.some(g => g.status === 'live')) $('livePill').style.display = '';

    list.innerHTML = games.map(g => {
        const sc = g.status === 'live' ? 'live' :
                   g.status === 'completed' ? 'completed' :
                   g.status === 'cancelled' ? 'cancelled' : 'scheduled';
        const showScore = g.status === 'completed' || g.status === 'live';
        const score = showScore && (g.homeScore != null || g.awayScore != null)
            ? `<div class="game-score">${g.homeScore ?? 0} - ${g.awayScore ?? 0}</div>`
            : '';
        const href = `/game.html?team=${encodeURIComponent(hubCode)}&game=${encodeURIComponent(g.id)}`;
        const matchup = (g.matchupLabel || '').trim();
        const metaParts = [];
        if (matchup) metaParts.push(`🏷️ ${matchup}`);
        if (g.location) metaParts.push(`📍 ${g.location}`);
        if (g.notes) metaParts.push(g.notes);
        const meta = metaParts.join(' · ');
        return `<a class="game-card ${g.status === 'live' ? 'live' : ''}" href="${href}">
            <div class="game-row">
                <div class="game-left">
                    <span class="game-status ${sc}">${statusLabel(g)}</span>
                    <div class="game-opponent">${gameHeadline(g)}</div>
                    ${meta ? `<div class="game-meta">${meta}</div>` : ''}
                </div>
                ${score}
                <span class="game-chevron">›</span>
            </div>
        </a>`;
    }).join('');
}

// ══════════════════════════════════════════════════════════════════════
// Tournament v2 — live fan page (mockup "Fans · Event page")
// ══════════════════════════════════════════════════════════════════════
const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tms = v => v == null ? 0 : (typeof v === 'number' ? v : (v.toMillis ? v.toMillis() : Date.parse(v) || 0));
const hhmm = m => m ? new Date(m).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
let V = { teamId: null, team: null, ev: null, nodes: [], games: new Map(), legacy: new Map(), tab: 'ours', unsub: [] };

function startV2(teamId, team, evSnap) {
    V.teamId = teamId; V.team = team;
    $('legacySection').style.display = 'none';
    $('v2').style.display = '';
    const evRef = doc(db, 'teams', teamId, 'events', eventId);
    V.unsub.push(onSnapshot(evRef, s => { V.ev = s.exists() ? s.data() : null; renderV2(); }));
    V.unsub.push(onSnapshot(collection(evRef, 'matches'), s => { V.nodes = s.docs.map(d => ({ id: d.id, ...d.data() })); renderV2(); }));
    const games = collection(db, 'teams', teamId, 'games');
    V.unsub.push(onSnapshot(query(games, where('eventId', '==', eventId)), s => { V.games = new Map(s.docs.map(d => [d.id, { id: d.id, ...d.data() }])); renderV2(); }));
    V.unsub.push(onSnapshot(query(games, where('parentEventId', '==', eventId)), s => { V.legacy = new Map(s.docs.map(d => [d.id, { id: d.id, ...d.data() }])); renderV2(); }, () => {}));
}

// Pool teams, plus the event's own team list for a bracket-only tournament
// (2026-10-02 — no pools, so the teams live on the event).
function v2AllTeams() {
    return (V.ev?.pools || []).flatMap(p => p.teams || []).concat(V.ev?.teams || []);
}
function v2TeamName(id) {
    const t = v2AllTeams().find(t => t.id === id);
    return t ? t.name : null;
}
function v2Us() {
    const t = v2AllTeams().find(t => t.us);
    return t ? t.id : V.teamId;
}
function v2Resolved(id) { return ((V.ev?.computed || {}).resolved || []).find(r => r.id === id) || {}; }
function v2Sets(g) {
    const st = g.sportSpecificStats || {};
    const h = st.homeScoreBySet || [], a = st.awayScoreBySet || [];
    const weHome = !g.homeTeamId || g.homeTeamId === V.teamId;
    return h.map((x, i) => weHome ? [x, a[i] || 0] : [a[i] || 0, x]).filter(([x, y]) => x || y);
}
// "sets" (volleyball) or "score" (every other sport: one final score).
function v2IsScore() {
    const c = (V.ev && V.ev.computed || {}).scoring;
    return (c || (String((V.ev && V.ev.sport) || 'VOLLEYBALL').toUpperCase() === 'VOLLEYBALL' ? 'sets' : 'score')) === 'score';
}
// A tied bracket game decided by overtime/shootout: +1 we won, -1 we lost.
function v2Decided(n) {
    if (!n || !n.winner) return 0;
    const r = v2Resolved(n.id), side = n.winner === 'a' ? (r.a || (n.a || {}).teamId) : (r.b || (n.b || {}).teamId);
    return side === v2Us() ? 1 : -1;
}
function v2Result(g) {
    const sets = v2Sets(g);
    let w, l;
    if (sets.length) { w = sets.filter(s => s[0] > s[1]).length; l = sets.filter(s => s[1] > s[0]).length; }
    else { const weHome = !g.homeTeamId || g.homeTeamId === V.teamId; w = weHome ? g.homeScore || 0 : g.awayScore || 0; l = weHome ? g.awayScore || 0 : g.homeScore || 0; }
    return { w, l, sets };
}
// "Court 3" for a bare number; an imported AES name ("HOMESTEAD HS Ct 2") as is.
function v2Court(c, short) { return /^\d+$/.test(String(c)) ? (short ? 'Ct ' : 'Court ') + c : String(c); }
function v2OurGames() {
    const nodeByGame = new Map(V.nodes.filter(n => n.gameId).map(n => [n.gameId, n]));
    const games = [...new Map([...V.legacy, ...V.games]).values()].map(g => {
        const n = nodeByGame.get(g.id);
        return { g, n, time: tms(n?.time) || tms(g.date) };
    });
    // A result with no recording (AES import of matches already played).
    for (const n of V.nodes) {
        if (!n.ours || n.gameId || n.status !== 'completed' || !(n.sets || []).length) continue;
        games.push({ n, time: tms(n.time), g: { id: 'result:' + n.id, status: 'completed', opponent: (n.b || {}).name || '',
            court: n.court || '', phaseLabel: n.label || '', homeTeamId: V.teamId,
            sportSpecificStats: { homeScoreBySet: n.sets.map(x => x.a || 0), awayScoreBySet: n.sets.map(x => x.b || 0) } } });
    }
    return games.sort(v2Order);
}
// 2026-10-01: the bracket builder gives no match a time, so sorting by time
// put played matches after unplayed ones. With no times in the draw, the draw
// order is the order of play; matches added by hand follow, by date.
function v2Order(a, b) {
    if (V.nodes.some(n => tms(n.time) > 0)) return a.time - b.time;
    const d = o => o.n ? (o.n.phase === 'pool' ? 0 : 1) * 10000 + (o.n.round || 0) * 100 + (o.n.slot || 0) : Infinity;
    return (d(a) - d(b)) || (a.time - b.time);
}
function v2Watch(g) {
    const streams = Array.isArray(g.streams) ? g.streams : [];
    const url = (streams.find(s => s && s.url) || {}).url || g.streamUrl || g.youtubeVideoUrl || '';
    return /^https:\/\//.test(url) ? url : '';
}

function renderV2() {
    const ev = V.ev; if (!ev) return;
    document.title = `${ev.name || 'Tournament'} — ScoreFrame`;
    $('heroTitle').textContent = ev.name || 'Tournament';
    const start = tms(ev.startDate), end = tms(ev.endDate);
    $('heroDate').textContent = end && end > start ? formatDateRange(start, end) : formatDate(start);
    if (ev.venue) { $('heroLocation').textContent = `📍 ${ev.venue}`; $('heroLocation').style.display = ''; }

    const ours = v2OurGames();
    const live = ours.find(o => o.g.status === 'live');
    // The server's pick when it has one, so this page and the coach's screen agree.
    const serverNext = ((ev.computed || {}).next || {}).matchId;
    const next = (serverNext && ours.find(o => o.g.status === 'scheduled' && o.n && o.n.id === serverNext))
        || ours.find(o => o.g.status === 'scheduled');
    const done = ours.filter(o => o.g.status === 'completed');
    let mw = 0, ml = 0, ms = 0, sw = 0, sl = 0;
    for (const o of done) {
        const r = v2Result(o.g); sw += r.w; sl += r.l;
        const d = r.w === r.l ? v2Decided(o.n) : 0;   // tied bracket game decided by tiebreak
        if (r.w > r.l || d > 0) mw++; else if (r.l > r.w || d < 0) ml++; else ms++;
    }
    $('livePill').style.display = live ? '' : 'none';
    const us = v2Us();
    const standings = (ev.computed || {}).standings || [];
    const myPool = standings.find(s => (s.rows || []).some(r => r.teamId === us));
    const myRow = myPool && myPool.rows.find(r => r.teamId === us);
    const poolName = myPool ? ((ev.pools || []).find(p => p.id === myPool.poolId) || {}).name || myPool.poolId : null;

    let h = '';
    if (live) {
        const url = v2Watch(live.g);
        const href = url || `/game.html?team=${encodeURIComponent(hubCode)}&game=${encodeURIComponent(live.g.id)}`;
        const r = v2Result(live.g);
        h += `<a class="v2-card v2-live" href="${escH(href)}" ${url ? 'target="_blank" rel="noopener"' : ''}>
            <div class="v2-play">▶</div>
            <div style="flex:1;min-width:0"><div class="v2-lbl" style="color:var(--recording-red)">Live now</div>
            <div class="v2-big">vs ${escH(live.g.opponent || 'TBD')}</div>
            <div class="v2-sub">${escH([live.n?.label, live.g.court ? v2Court(live.g.court) : ''].filter(Boolean).join(' · '))}</div></div>
            <div class="v2-res" style="font-size:22px">${r.sets.length ? escH(r.sets[r.sets.length - 1].join('–')) : v2IsScore() ? escH(r.w + '–' + r.l) : ''}</div></a>`;
    }
    if (next) {
        const mins = Math.round((next.time - Date.now()) / 60000);
        const when = next.time ? (mins > 0 && mins < 600 ? `in ${mins >= 60 ? Math.floor(mins / 60) + 'h ' : ''}${mins % 60}m` : hhmm(next.time)) : 'time TBD';
        h += `<div class="v2-card" style="display:flex;align-items:center;gap:12px">
            <div style="flex:1"><div class="v2-lbl" style="color:var(--accent)">Next match</div>
            <div style="font-weight:700">${escH([next.n ? v2MatchTitle(next.n) : '', 'vs ' + (next.g.opponent || 'TBD')].filter(Boolean).join(' · '))}</div>
            <div class="v2-sub">${escH([next.time ? hhmm(next.time) : '', next.g.court ? v2Court(next.g.court) : ''].filter(Boolean).join(' · '))}</div></div>
            <div class="v2-res" style="color:var(--accent)">${escH(when)}</div></div>`;
    }
    if (done.length || myRow) {
        h += `<div class="v2-tiles">
            <div class="v2-tile"><span class="v2-lbl">Matches</span><span class="v">${mw}-${ml}${ms ? '-' + ms : ''}</span></div>
            <div class="v2-tile"><span class="v2-lbl">${v2IsScore() ? 'Points' : 'Sets'}</span><span class="v">${sw}-${sl}</span></div>
            ${ev.bracketOnly || !(ev.pools || []).length ? '' : `<div class="v2-tile"><span class="v2-lbl">${escH(poolName || 'Pool')}</span><span class="v" style="color:#FFC800">${myRow ? ordinal(myRow.place) : '—'}</span></div>`}</div>`;
    }
    const hasPools = (ev.pools || []).length > 0;
    const hasDraw = hasPools || ev.bracketOnly === true;
    h += `<div class="v2-tabs">${[['ours', 'Our matches'], ...(hasPools ? [['pools', 'Pools']] : []), ...(hasDraw ? [['bracket', 'Bracket']] : [])]
        .map(([k, l]) => `<button class="v2-tab ${V.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>`;

    if (V.tab === 'pools') h += v2Pools(standings, us);
    else if (V.tab === 'bracket') h += v2Bracket(us);
    else {
        h += `<div class="v2-card" style="padding:0 14px">` + (ours.length ? ours.map(o => {
            const g = o.g, r = v2Result(g);
            const d = r.w === r.l && g.status === 'completed' ? v2Decided(o.n) : 0;
            if (d) { r.w += d > 0 ? 0.0001 : 0; r.l += d < 0 ? 0.0001 : 0; }
            const cls = g.status !== 'completed' ? '' : r.w > r.l ? 'v2-win' : r.l > r.w ? 'v2-loss' : '';
            const bar = g.status === 'live' ? 'var(--recording-red)' : g.status !== 'completed' ? 'var(--bg-elevated)' : r.w > r.l ? '#FFC800' : r.l > r.w ? 'var(--loss-red)' : 'var(--tie-grey)';
            const sc = `${Math.floor(r.w)}-${Math.floor(r.l)}${d ? ' (tiebreak)' : ''}`;
            const res = g.status === 'completed' ? (r.w > r.l ? `W ${sc}` : r.l > r.w ? `L ${sc}` : sc) : g.status === 'live' ? 'LIVE' : '';
            const watch = v2Watch(g);
            const sub = [o.time ? hhmm(o.time) : '', o.n?.label || g.phaseLabel, g.court ? v2Court(g.court) : '', r.sets.map(s => s.join('-')).join(', ')].filter(Boolean).join(' · ');
            // A result with no recording has no game page to open.
            const tag = String(g.id).startsWith('result:') ? 'div' : 'a';
            const href = tag === 'a' ? ` href="/game.html?team=${encodeURIComponent(hubCode)}&game=${encodeURIComponent(g.id)}"` : '';
            return `<${tag} class="v2-row"${href}>
                <div class="v2-bar" style="background:${bar}"></div>
                <div style="flex:1;min-width:0"><div style="font-weight:700">vs ${escH(g.opponent || 'TBD')}</div><div class="v2-sub">${escH(sub)}${watch ? ' · Watch' : ''}</div></div>
                <div class="v2-res ${cls}">${escH(res)}</div></${tag}>`;
        }).join('') : `<div class="empty" style="padding:16px 0">No matches yet. They'll appear here as the day is set up.</div>`) + `</div>`;
        const open = V.nodes.filter(n => !n.ours && n.phase === 'pool' && myPool && n.poolId === myPool.poolId && !(n.sets || []).length);
        if (open.length) {
            h += `<div class="v2-card"><div class="v2-lbl">Know a score from another court?</div>` + open.map(n =>
                `<div class="v2-row" style="border:none;padding:8px 0"><div style="flex:1">${escH((v2TeamName(n.a?.teamId) || '?') + ' vs ' + (v2TeamName(n.b?.teamId) || '?'))}<div class="v2-sub">${escH([n.label, n.court ? v2Court(n.court) : ''].filter(Boolean).join(' · '))}</div></div>
                 <button class="v2-link" data-score="${escH(n.id)}">Add score</button></div><div id="sf-${escH(n.id)}"></div>`).join('') + `</div>`;
        }
    }
    $('v2').innerHTML = h;
    $('v2').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { V.tab = b.dataset.tab; renderV2(); });
    $('v2').querySelectorAll('[data-score]').forEach(b => b.onclick = () => v2ScoreForm(b.dataset.score));
}

function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function v2Pools(standings, us) {
    if (!standings.length) return `<div class="v2-card v2-sub">Standings appear once scores come in.</div>`;
    return standings.map(s => {
        const name = ((V.ev.pools || []).find(p => p.id === s.poolId) || {}).name || s.poolId;
        return `<div class="v2-card"><div class="v2-lbl">${escH(name)}${s.complete ? ' · final' : ''}</div>
          <table class="v2-table"><tr><th>#</th><th>Team</th><th class="r">${v2IsScore() ? 'W-L-T' : 'Sets'}</th><th class="r">${v2IsScore() ? '+/-' : 'Pts'}</th></tr>` +
          s.rows.map(r => `<tr class="${r.teamId === us ? 'us' : ''}"><td>${r.place}</td><td>${escH(r.name)}</td><td class="r">${v2IsScore() ? `${r.wins}-${r.losses}${r.splits ? '-' + r.splits : ''}` : `${r.setsWon}-${r.setsLost}`}</td><td class="r">${r.pointDiff > 0 ? '+' : ''}${r.pointDiff}</td></tr>`).join('') +
          `</table></div>`;
    }).join('') + `<div class="v2-sub">${v2IsScore() ? 'Ranked by wins (a tie counts half), point difference, head-to-head, points scored.' : 'Ranked by match wins, set %, point difference, head-to-head.'}</div>`;
}

// Drawn bracket (2026-10-02, Eric: "a more graphic bracket style with lines
// shown on the fan page"). Same layout as the coach's screen in the app.
function v2Bracket(us) {
    let h = '';
    for (const phase of ['gold', 'silver']) {
        const list = V.nodes.filter(n => n.phase === phase);
        if (!list.length) continue;
        h += `<div class="v2-card"><div class="v2-lbl">${V.ev.bracketOnly ? (phase === 'gold' ? 'Bracket' : 'Consolation') : (phase === 'gold' ? 'Gold bracket' : 'Silver bracket')}</div>`
          + `<div class="br-scroll">${v2DrawBracket(list, us, phase)}</div></div>`;
    }
    return (h || `<div class="v2-card v2-sub">No bracket yet.</div>`) + (V.ev.bracketOnly ? '' : `<div class="v2-sub">? = projected from the standings so far.</div>`);
}

function v2MatchTitle(n) { return n.name || n.label || ''; }

function v2Side(n, isA) {
    const r = v2Resolved(n.id), ref = (isA ? n.a : n.b) || {};
    const actual = isA ? r.a : r.b, proj = isA ? r.projectedA : r.projectedB;
    const id = actual || ((n.round === 1 || !ref.matchId) ? ref.teamId : null);
    if (id && id !== 'BYE') {
        const t = v2AllTeams().find(t => t.id === id) || {};
        return { text: t.name || v2TeamName(id) || 'Team', seed: t.seed || '', id, us: !!t.us };
    }
    if (ref.bye || id === 'BYE') return { text: 'Bye', ph: true };
    if (proj && proj !== 'BYE') return { text: `${v2TeamName(proj) || 'Team'}?`, ph: true };
    if (ref.matchId) {
        const f = V.nodes.find(x => x.id === ref.matchId);
        return { text: `${ref.from === 'loser' ? 'Loser' : 'Winner'} ${f ? v2MatchTitle(f) : ''}`.trim(), ph: true };
    }
    return { text: 'TBD', ph: true };
}

function v2DrawBracket(list, us, phase) {
    const W = 196, H = 92, CG = 34, RG = 12, TOP = 20;
    const rounds = [...new Set(list.map(n => n.round))].sort((a, b) => a - b)
        .map(r => list.filter(n => n.round === r).sort((a, b) => (a.slot || 0) - (b.slot || 0)));
    const y = new Map();
    rounds.forEach((col, ci) => col.forEach((n, i) => {
        const fs = [n.a, n.b].filter(x => x && x.matchId && x.from !== 'loser' && y.has(x.matchId)).map(x => y.get(x.matchId));
        y.set(n.id, ci > 0 && fs.length ? fs.reduce((s, v) => s + v, 0) / fs.length : TOP + i * (H + RG) * (1 << Math.min(ci, 4)));
    }));
    const width = rounds.length * W + (rounds.length - 1) * CG;
    const height = Math.max(...y.values()) + H + 8;
    const colOf = id => rounds.findIndex(c => c.some(n => n.id === id));
    let paths = '', cards = '';
    const total = rounds.length;
    rounds.forEach((col, ci) => {
        const k = total - ci - 1;
        const base = k === 0 ? 'FINAL' : k === 1 ? 'SEMIFINALS' : k === 2 ? 'QUARTERFINALS' : `ROUND ${ci + 1}`;
        const title = phase === 'silver' && V.ev.bracketOnly ? (k === 0 ? 'CONSOLATION FINAL' : 'CONSOLATION ' + base) : base;
        cards += `<div class="br-rt" style="left:${ci * (W + CG)}px">${title}</div>`;
        col.forEach(n => {
            const x = ci * (W + CG), top = y.get(n.id);
            for (const ref of [n.a, n.b]) {
                if (!ref || !ref.matchId || ref.from === 'loser' || !y.has(ref.matchId)) continue;
                const fx = colOf(ref.matchId) * (W + CG) + W, fy = y.get(ref.matchId) + H / 2, ty = top + H / 2, mx = fx + CG / 2;
                const f = V.nodes.find(z => z.id === ref.matchId);
                paths += `<path class="${f && (f.sets || []).length && (!v2IsScore() || f.status === 'completed') ? 'hot' : ''}" d="M${fx},${fy} H${mx} V${ty} H${x}"/>`;
            }
            const sa = v2Side(n, true), sb = v2Side(n, false);
            let sets = n.sets || [], wa, wb, win = null;
            if (v2IsScore()) {
                const f = sets[0];
                if (!f || n.status === 'scheduled') sets = [];
                wa = f ? f.a || 0 : 0; wb = f ? f.b || 0 : 0;
                if (n.status === 'completed' && f) win = wa > wb ? 'a' : wb > wa ? 'b' : n.winner || null;
            } else {
                wa = sets.filter(z => (z.a || 0) > (z.b || 0)).length; wb = sets.filter(z => (z.b || 0) > (z.a || 0)).length;
                if (sets.length) win = wa > wb ? 'a' : wb > wa ? 'b' : null;
            }
            const tm = tms(n.time) ? hhmm(tms(n.time)) : '';
            const meta = [tm, n.court ? v2Court(n.court, true) : ''].filter(Boolean).join(' · ') || 'time TBD';
            const row = (sd, i) => {
                const won = win === (i === 0 ? 'a' : 'b');
                const opp = sd.id ? (v2AllTeams().find(t => t.id === sd.id) || {}) : {};
                const dot = sd.us ? 'var(--accent)' : null;
                return `<div class="br-t ${sd.us ? 'us' : ''} ${won ? 'won' : ''}"><span class="br-seed">${escH(sd.seed || '–')}</span>`
                    + (dot ? `<span class="br-dot" style="background:${dot}"></span>` : '')
                    + `<span class="br-n ${sd.ph ? 'ph' : ''}">${escH(sd.text)}</span>`
                    + (sets.length ? `<span class="br-s">${i === 0 ? wa : wb}</span>` : '') + `</div>`;
            };
            // A bye isn't a game: dashed, no number, no time (2026-10-03).
            const bye = !!((n.a || {}).bye || (n.b || {}).bye);
            cards += `<div class="br-m ${!bye && (sa.us || sb.us) ? 'us' : ''} ${bye ? 'bye' : ''}" style="left:${x}px;top:${top}px;height:${H}px">`
                + `<div class="br-h"><b>${bye ? 'Bye — moves on' : escH(v2MatchTitle(n))}</b><span>${bye ? '' : escH(meta)}</span></div>` + row(sa, 0) + row(sb, 1) + `</div>`;
        });
    });
    return `<div class="br" style="width:${width}px;height:${height}px"><svg width="${width}" height="${height}">${paths}</svg>${cards}</div>`;
}

function v2ScoreForm(nodeId) {
    const n = V.nodes.find(x => x.id === nodeId); const box = $('sf-' + nodeId);
    if (!n || !box) return;
    if (!auth.currentUser || auth.currentUser.isAnonymous) { box.innerHTML = `<div class="v2-sub">Sign in as a follower of this team to add scores.</div>`; return; }
    const sets = v2IsScore() ? 1 : n.phase === 'pool' ? 2 : 3;
    const A = v2TeamName(n.a?.teamId) || 'Team A', B = v2TeamName(n.b?.teamId) || 'Team B';
    const cells = side => Array.from({ length: 3 }, (_, i) => i < sets ? `<input inputmode="numeric" data-s="${i}" data-side="${side}" aria-label="${escH((side === 'a' ? A : B) + (v2IsScore() ? ' final score' : ' set ' + (i + 1)))}">` : '<span></span>').join('');
    box.innerHTML = `<div class="v2-score"><span>${escH(A)}</span>${cells('a')}<span>${escH(B)}</span>${cells('b')}</div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:8px"><button class="v2-btn" id="sv-${escH(nodeId)}">Save result</button><span class="v2-sub" id="sm-${escH(nodeId)}"></span></div>`;
    $('sv-' + nodeId).onclick = async () => {
        const val = (side, i) => parseInt((box.querySelector(`input[data-side="${side}"][data-s="${i}"]`) || {}).value || '', 10);
        const out = [];
        // A final score may be 0-0 (a scoreless draw); a set may not.
        for (let i = 0; i < sets; i++) { const x = val('a', i), y = val('b', i); if (Number.isFinite(x) && Number.isFinite(y) && (x || y || v2IsScore())) out.push({ a: x, b: y }); }
        if (!out.length) { $('sm-' + nodeId).textContent = v2IsScore() ? 'Enter the final score.' : 'Enter at least one set.'; return; }
        try {
            await updateDoc(doc(db, 'teams', V.teamId, 'events', eventId, 'matches', nodeId), {
                sets: out, status: 'completed',
                updatedBy: { uid: auth.currentUser.uid, name: auth.currentUser.displayName || '' }, updatedAt: Date.now() });
        } catch (e) { $('sm-' + nodeId).textContent = 'Only approved followers of this team can add scores.'; }
    };
}

(async () => {
    await tryAppAuthHandoff();
    await authReady;
    loadEvent();
})();
</script>
