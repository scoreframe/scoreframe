<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- NOT INDEXABLE (2026-08-16).
     These pages carry roster names, jersey numbers, schedules and venues for
     teams that are often children. A search engine turning that into a
     findable profile — name + number + team + where they'll be on Saturday —
     is a bigger exposure than any in-app viewer, and it's the one an outsider
     actually stumbles across.

     Deliberately NOT blocked in robots.txt: a disallowed page can't be
     fetched, so the crawler never SEES this tag and Google may still index the
     bare URL from inbound links. Allow the crawl, refuse the index. -->
<meta name="robots" content="noindex, nofollow">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<title>ScoreFrame — Event</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg-deepest: #0D0D0D; --bg-deep: #141414; --bg-surface: #1E1E1E;
    --bg-elevated: #272727; --accent: #FF9640; --accent-dim: rgba(255,150,64,0.15);
    --text-primary: #E0E0E0; --text-secondary: #999; --text-muted: #666;
    --success: #4CAF50; --error: #F44336; --recording-red: #CC2222;
    --win-green: #2E7D32; --loss-red: #C62828; --tie-grey: #777777;
}
/* In-app theme override — GamePageActivity/GamePageView appends ?theme=light|dark. */
body[data-theme="dark"] {
    --bg-deepest: #0D0D0D !important; --bg-deep: #141414 !important; --bg-surface: #1E1E1E !important;
    --bg-elevated: #272727 !important; --accent: #FF9640 !important; --accent-dim: rgba(255,150,64,0.15) !important;
    --text-primary: #E0E0E0 !important; --text-secondary: #999 !important; --text-muted: #666 !important;
    --win-green: #2E7D32 !important; --loss-red: #C62828 !important; --tie-grey: #777777 !important;
}
body[data-theme="light"] {
    --bg-deepest: #F5F5F2 !important; --bg-deep: #FFFFFF !important; --bg-surface: #FFFFFF !important;
    --bg-elevated: #ECECE8 !important; --accent: #E47A1F !important; --accent-dim: rgba(228,122,31,0.15) !important;
    --text-primary: #1A1A1A !important; --text-secondary: #555 !important; --text-muted: #888 !important;
    --win-green: #1B5E20 !important; --loss-red: #B71C1C !important; --tie-grey: #888888 !important;
}

/* ── In-app colour palette (?palette=) — added 2026-08-01 ─────────────
   The APP appends ?palette=<name> when it opens this page in its WebView so
   the page matches whichever palette the user picked in Settings. It is a
   personal preference, NOT branding: share/copy links deliberately omit it,
   so anyone opening a shared link gets ScoreFrame orange.

   Deliberately a SEPARATE param from ?theme= — that one already means
   light|dark here and has since v14. Overloading it would have broken every
   existing in-app link.

   Unknown or absent value = no selector matches = brand orange. That is the
   whole backwards-compatibility story; nothing else needs a fallback.

   Two-attribute selectors beat the one-attribute body[data-theme] blocks
   above on specificity, so the light variants below win where both apply. */
body[data-palette="trailhead"] {
    --accent: #8E9A45 !important; --accent-dim: rgba(142,154,69,0.15) !important;
}
body[data-theme="light"][data-palette="trailhead"] {
    --accent: #4E5A21 !important; --accent-dim: rgba(78,90,33,0.15) !important;
}
body[data-palette="floodlight"] {
    --accent: #4E9CE8 !important; --accent-dim: rgba(78,156,232,0.15) !important;
}
body[data-theme="light"][data-palette="floodlight"] {
    --accent: #1C5FA8 !important; --accent-dim: rgba(28,95,168,0.15) !important;
}
@media (prefers-color-scheme: light) {
    :root {
        --bg-deepest: #F5F5F2; --bg-deep: #FFFFFF; --bg-surface: #FFFFFF;
        --bg-elevated: #ECECE8; --accent: #E47A1F; --accent-dim: rgba(228,122,31,0.15);
        --text-primary: #1A1A1A; --text-secondary: #555; --text-muted: #888;
        --win-green: #1B5E20; --loss-red: #B71C1C; --tie-grey: #888888;
    }
}
body.app .top-bar { display: none; }
html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-deepest); color: var(--text-primary);
    min-height: 100vh; overflow-x: hidden;
}

.top-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--bg-deep);
    border-bottom: 1px solid var(--bg-elevated);
}
.brand { text-decoration: none; font-size: 1.1rem; font-weight: 800; color: var(--text-primary); }
.brand .accent { color: var(--accent); }
.back-link {
    margin-left: auto; font-size: 13px; color: var(--text-secondary);
    text-decoration: none; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--bg-elevated);
}
.back-link:hover { color: var(--accent); border-color: var(--accent); }

.hero {
    padding: 24px; text-align: center;
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deepest) 100%);
    border-bottom: 1px solid var(--bg-elevated);
}
.team-color-bar { height: 4px; border-radius: 2px; margin-bottom: 14px; max-width: 480px; margin-left: auto; margin-right: auto; }
.event-type-badge {
    display: inline-block; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; padding: 4px 10px; border-radius: 4px;
    margin-bottom: 12px; color: var(--accent); background: var(--accent-dim);
}
.hero-team { font-size: 13px; color: var(--text-secondary); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.hero-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.hero-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
.live-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--recording-red); color: white; padding: 3px 10px;
    border-radius: 10px; font-size: 11px; font-weight: 700;
    animation: pulse 1s ease-in-out infinite; margin-top: 10px;
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

.section { padding: 20px 24px; }
.section-title {
    font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 12px;
}
.section-sub {
    font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
}
.empty {
    padding: 20px; text-align: center;
    color: var(--text-muted); font-size: 14px; font-style: italic;
    background: var(--bg-surface); border-radius: 12px;
    border: 1px dashed var(--bg-elevated);
}

.game-card {
    background: var(--bg-surface); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--bg-elevated);
    display: block; text-decoration: none; color: inherit;
}
.game-card:hover { border-color: var(--accent); }
.game-card.live { border-color: var(--recording-red); }
.game-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.game-left { flex: 1; min-width: 0; }
.game-status {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; margin-bottom: 6px;
}
.game-status.live { background: var(--recording-red); color: white; }
.game-status.scheduled { background: var(--accent-dim); color: var(--accent); }
.game-status.completed { background: rgba(76,175,80,0.15); color: var(--success); }
.game-status.cancelled { background: var(--bg-elevated); color: var(--text-muted); }
.game-opponent { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.game-meta { font-size: 12px; color: var(--text-muted); }
.game-score {
    font-size: 22px; font-weight: 800; color: var(--accent);
    margin-left: 12px; white-space: nowrap;
}
.game-chevron {
    color: var(--text-muted); font-size: 18px; margin-left: 6px;
}

/* ── DESKTOP LAYOUT (Eric, 2026-08-17) ────────────────────────────────────
   These pages were built mobile-first with no width ceiling, so on a laptop
   every row stretched the full window — a team name on the far left and its
   buttons on the far right, with a metre of nothing between. Mobile is
   untouched; above 900px the content becomes a centred column of readable
   width, which is what "bring the buttons in from the left and right" means.
   A ceiling rather than a redesign: the same markup, just stopped from
   spreading. */
@media (min-width: 900px) {
  body > .top-bar, body > .hero, body > .section, body > div[id] {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }
}
</style>
<script>
/* Palette param — mirrors the theme block above. Applied to <html> before
   paint and to <body> once it exists, same two-step as ?theme=, so there is
   no flash of the wrong accent. 2026-08-01. */
(function() {
    try {
        var p = new URLSearchParams(location.search).get('palette');
        if (p === 'trailhead' || p === 'floodlight') {
            document.documentElement.setAttribute('data-palette', p);
            if (document.body) {
                document.body.setAttribute('data-palette', p);
            } else {
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.setAttribute('data-palette', p);
                });
            }
        }
    } catch (e) {}
})();
</script>
</head>
<body>

<div class="top-bar">
    <a href="/" class="brand">Score<span class="accent">Frame</span></a>
    <a id="backLink" href="/" class="back-link">← Back</a>
</div>

<div class="hero">
    <div id="teamColorBar" class="team-color-bar" style="display:none;"></div>
    <div class="event-type-badge">🏆 TOURNAMENT</div>
    <div id="heroTeam" class="hero-team">—</div>
    <div id="heroTitle" class="hero-title">Loading…</div>
    <div id="heroDate" class="hero-meta">—</div>
    <div id="heroRecord" class="hero-meta" style="display:none;font-weight:700;color:var(--accent);"></div>
    <div id="heroLocation" class="hero-meta" style="display:none;"></div>
    <div id="heroSeason" class="hero-meta" style="display:none;"></div>
    <div id="heroNotes" class="hero-meta" style="margin-top:8px;font-style:italic;display:none;"></div>
    <div id="livePill" class="live-pill" style="display:none;">● LIVE NOW</div>
</div>

<div class="section">
    <div class="section-title">Games in this event</div>
    <div id="gamesList"></div>
</div>

<script type="module">
// Theme override from URL param (matches game.html).
(function() {
    try {
        var t = new URLSearchParams(location.search).get('theme');
        if (t === 'light' || t === 'dark') document.body.setAttribute('data-theme', t);
    } catch (_) {}
    if (new URLSearchParams(location.search).get('app') === '1') document.body.classList.add('app');
})();

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { initializeFirestore, getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBhqtlHshe3wEEPkJe7mVUIrZ1IJirullU",
    authDomain: "scoreframe-deploy.firebaseapp.com",
    databaseURL: "https://scoreframe-deploy-default-rtdb.firebaseio.com",
    projectId: "scoreframe-deploy",
    storageBucket: "scoreframe-deploy.firebasestorage.app",
    messagingSenderId: "728886280072",
    appId: "1:728886280072:android:0050478669b89fc76b043d"
};
const app = initializeApp(firebaseConfig);
// 2026-08-26 — initializeFirestore, not getFirestore.
//
// Eric hit "Loading team..." for a full two minutes on iOS, then it appeared.
// That number is the tell: the Firestore SDK talks WebChannel (a streaming
// transport) by default, and inside a WKWebView / Android WebView that stream
// can stall silently until it times out and falls back. The page isn't broken
// and the query isn't slow — the first read is just sitting on a dead socket.
//
// autoDetect spots the stalled stream and switches to long-polling in seconds
// instead of minutes. Preferred over experimentalForceLongPolling because
// these pages are also opened in ordinary desktop browsers, where WebChannel
// works fine and is the more efficient transport.
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const auth = getAuth(app);

// 2026-06-19 — Mirror team.html's SSO + auth-state gating. event.html
// previously called loadEvent() directly with no auth session, so on
// security-rules-restricted reads (team doc / past games) every fetch
// failed → "Could not load team" + empty games list. Now we wait for
// the WebView SSO handoff (#auth=<idToken> from the native app) and the
// first onAuthStateChanged event before fetching anything.
async function tryAppAuthHandoff() {
    const hash = window.location.hash || '';
    const m = hash.match(/[#&]auth=([^&]+)/);
    if (!m) return false;
    const idToken = decodeURIComponent(m[1]);
    try {
        const cleanHash = hash.replace(/[#&]auth=[^&]+/, '').replace(/^#$/, '');
        history.replaceState(null, '', window.location.pathname + window.location.search + cleanHash);
    } catch (_) {}
    try {
        const resp = await fetch('https://us-central1-scoreframe-deploy.cloudfunctions.net/mintAuthToken', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + idToken }
        });
        if (!resp.ok) { console.warn('[event auth] mintAuthToken ' + resp.status); return false; }
        const data = await resp.json();
        if (!data.customToken) return false;
        await signInWithCustomToken(auth, data.customToken);
        console.log('[event auth] SSO handoff complete');
        return true;
    } catch (e) {
        console.warn('[event auth] SSO handoff failed:', e);
        return false;
    }
}

let authResolved = false;
let authResolveFn = null;
const authReady = new Promise((resolve) => {
    authResolveFn = resolve;
    setTimeout(() => {
        if (!authResolved) { authResolved = true; resolve(); }
    }, 2000);
});
onAuthStateChanged(auth, () => {
    if (!authResolved) {
        authResolved = true;
        authResolveFn && authResolveFn();
    }
});

const params = new URLSearchParams(location.search);
const hubCode = (params.get('team') || '').trim().toUpperCase();
const eventId = (params.get('event') || '').trim();

const $ = (id) => document.getElementById(id);
const SPORT_EMOJI = {
    Basketball: '🏀', Football: '🏈', Soccer: '⚽', Volleyball: '🏐',
    Baseball: '⚾', Softball: '🥎', Tennis: '🎾', Pickleball: '🏓',
    Hockey: '🏒', Lacrosse: '🥍', Bowling: '🎳', Generic: '🏆',
};

function formatDate(ms) {
    if (!ms || typeof ms !== 'number') return 'TBD';
    const d = new Date(ms);
    const opts = { weekday: 'short', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit' };
    return d.toLocaleString(undefined, opts);
}
// v15 — Multi-day tournament range. Falls back to single-date when end is
// missing or <= start.
function formatDateRange(startMs, endMs) {
    if (!endMs || endMs <= startMs) return formatDate(startMs);
    const s = new Date(startMs), e = new Date(endMs);
    const sStr = s.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const eStr = e.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return `${sStr} – ${eStr}`;
}

function statusLabel(g) {
    if (g.status === 'live') return '● LIVE';
    if (g.status === 'completed') return 'Final';
    if (g.status === 'cancelled') return 'Cancelled';
    return formatDate(g.date);
}

function gameHeadline(g) {
    if (g.opponent) return `vs ${g.opponent}`;
    if (g.eventName) return g.eventName;
    return 'Game';
}

async function loadEvent() {
    if (!hubCode || !eventId) {
        $('heroTitle').textContent = 'Missing event link';
        return;
    }
    let teamId = null;
    let team = null;
    try {
        const idx = await getDoc(doc(db, 'hubIndex', hubCode));
        if (!idx.exists()) {
            $('heroTitle').textContent = 'Team not found';
            return;
        }
        teamId = idx.data().teamId;
        const teamSnap = await getDoc(doc(db, 'teams', teamId));
        team = teamSnap.exists() ? teamSnap.data() : null;
    } catch (e) {
        console.error('Team lookup failed', e);
        $('heroTitle').textContent = 'Could not load team';
        return;
    }

    // Back link routes to the parent team page.
    $('backLink').href = `/team.html?code=${encodeURIComponent(hubCode)}`;
    $('backLink').textContent = `← ${team?.profile?.name || team?.name || 'Team'}`;

    // Team color stripe.
    const color = team?.profile?.color || team?.color;
    if (color) {
        const bar = $('teamColorBar');
        bar.style.background = color;
        bar.style.display = 'block';
    }
    const sport = team?.profile?.sport || team?.sport || '';
    const teamName = team?.profile?.name || team?.name || 'Team';
    $('heroTeam').textContent = `${SPORT_EMOJI[sport] || '🏆'} ${teamName}`;

    // Load event doc.
    let ev = null;
    try {
        const evSnap = await getDoc(doc(db, 'teams', teamId, 'games', eventId));
        if (!evSnap.exists()) {
            $('heroTitle').textContent = 'Event not found';
            return;
        }
        ev = { id: evSnap.id, ...evSnap.data() };
    } catch (e) {
        console.error('Event lookup failed', e);
        $('heroTitle').textContent = 'Could not load event';
        return;
    }

    // Hero metadata.
    document.title = `${ev.eventName || 'Tournament'} — ScoreFrame`;
    $('heroTitle').textContent = ev.eventName || 'Tournament';
    // v15 — Render the date range for multi-day tournaments.
    $('heroDate').textContent = (typeof ev.endDate === 'number' && ev.endDate > (ev.date || 0))
        ? formatDateRange(ev.date, ev.endDate)
        : formatDate(ev.date);
    if (ev.location) {
        $('heroLocation').textContent = `📍 ${ev.location}`;
        $('heroLocation').style.display = '';
    }
    if (ev.notes) {
        $('heroNotes').textContent = ev.notes;
        $('heroNotes').style.display = '';
    }
    if (ev.seasonId) {
        try {
            const seasonsSnap = await getDocs(collection(db, 'teams', teamId, 'seasons'));
            const s = seasonsSnap.docs.find(d => d.id === ev.seasonId);
            if (s) {
                const sd = s.data();
                $('heroSeason').textContent = `Season: ${sd.name}${sd.endDate ? ' (ended)' : ''}`;
                $('heroSeason').style.display = '';
            }
        } catch (_) {}
    }

    // Child games — gameIds[] on the parent event doc.
    const ids = Array.isArray(ev.gameIds) ? ev.gameIds.filter(x => typeof x === 'string' && x.length > 0) : [];
    const list = $('gamesList');
    if (ids.length === 0) {
        list.innerHTML = '<div class="empty">No games played in this event yet. They\'ll appear here as the event runs.</div>';
        return;
    }
    // Fetch child docs in parallel. Skip any that have been deleted.
    const fetched = await Promise.all(ids.map(async (gid) => {
        try {
            const snap = await getDoc(doc(db, 'teams', teamId, 'games', gid));
            return snap.exists() ? { id: snap.id, ...snap.data() } : null;
        } catch (_) { return null; }
    }));
    const games = fetched.filter(g => g != null);
    if (games.length === 0) {
        list.innerHTML = '<div class="empty">No games available.</div>';
        return;
    }
    // v18 — Event record line in the hero: W/L (team sports) or a scoring
    // summary (bowling) across the completed child games in this event.
    const completed = games.filter(g => g.status === 'completed');
    if (completed.length > 0) {
        const evSport = (team?.profile?.sport || team?.sport || completed[0].sport || '').toUpperCase();
        if (evSport === 'BOWLING') {
            let totalScore = 0, totalGames = 0, high = 0;
            for (const g of completed) {
                const ps = g.playerScores || '';
                if (ps) {
                    for (const b of ps.split(';')) {
                        const scs = (b.split(':')[1] || '').split(',').map(Number).filter(n => n > 0);
                        totalScore += scs.reduce((a, c) => a + c, 0);
                        totalGames += scs.length;
                        high = Math.max(high, ...scs, 0);
                    }
                } else if (g.homeScore > 0) {
                    totalScore += g.homeScore; totalGames++; high = Math.max(high, g.homeScore);
                }
            }
            const avg = totalGames > 0 ? Math.round(totalScore / totalGames) : 0;
            $('heroRecord').textContent = `${totalGames} game${totalGames !== 1 ? 's' : ''} · Avg ${avg} · High ${high}`;
            $('heroRecord').style.display = '';
        } else {
            let w = 0, l = 0, t = 0;
            for (const g of completed) {
                const hs = g.homeScore || 0, as_ = g.awayScore || 0;
                if (hs > as_) w++; else if (as_ > hs) l++; else if (hs > 0) t++;
            }
            const rec = `${w}W-${l}L` + (t > 0 ? `-${t}T` : '');
            $('heroRecord').textContent = `${rec} · ${completed.length} game${completed.length !== 1 ? 's' : ''}`;
            $('heroRecord').style.display = '';
        }
    }
    // Sort: live first, then scheduled by date asc, then completed by date desc.
    games.sort((a, b) => {
        const rank = (g) => g.status === 'live' ? 0 : g.status === 'scheduled' ? 1 : g.status === 'completed' ? 2 : 3;
        const ra = rank(a), rb = rank(b);
        if (ra !== rb) return ra - rb;
        const ad = a.date || 0, bd = b.date || 0;
        return rb === 2 ? bd - ad : ad - bd;
    });
    if (games.some(g => g.status === 'live')) $('livePill').style.display = '';

    list.innerHTML = games.map(g => {
        const sc = g.status === 'live' ? 'live' :
                   g.status === 'completed' ? 'completed' :
                   g.status === 'cancelled' ? 'cancelled' : 'scheduled';
        const showScore = g.status === 'completed' || g.status === 'live';
        const score = showScore && (g.homeScore != null || g.awayScore != null)
            ? `<div class="game-score">${g.homeScore ?? 0} - ${g.awayScore ?? 0}</div>`
            : '';
        const href = `/game.html?team=${encodeURIComponent(hubCode)}&game=${encodeURIComponent(g.id)}`;
        const matchup = (g.matchupLabel || '').trim();
        const metaParts = [];
        if (matchup) metaParts.push(`🏷️ ${matchup}`);
        if (g.location) metaParts.push(`📍 ${g.location}`);
        if (g.notes) metaParts.push(g.notes);
        const meta = metaParts.join(' · ');
        return `<a class="game-card ${g.status === 'live' ? 'live' : ''}" href="${href}">
            <div class="game-row">
                <div class="game-left">
                    <span class="game-status ${sc}">${statusLabel(g)}</span>
                    <div class="game-opponent">${gameHeadline(g)}</div>
                    ${meta ? `<div class="game-meta">${meta}</div>` : ''}
                </div>
                ${score}
                <span class="game-chevron">›</span>
            </div>
        </a>`;
    }).join('');
}

(async () => {
    await tryAppAuthHandoff();
    await authReady;
    loadEvent();
})();
</script>
